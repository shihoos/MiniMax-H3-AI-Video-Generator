custom_nodes:
  required:
    - name: "Comfyui_Minimax_h3_latent_Upscaler"
      repository: "https://github.com/LBH-123-AI/Comfyui_Minimax_h3_latent_Upscaler.git"
      revision: "6a4b191e8af583b7c097f564690325f91d18c2e2"
      purpose: "Native MiniMax H3 latent 2D/3D neural upscaling"
      required_variant: "3D"
      model_directory: "latent_upscale_models"
      required: true

    - name: "Comfyui-MMH3-UltimateUpscale"
      repository: "https://github.com/bbaudio-2025/Comfyui-MMH3-UltimateUpscale.git"
      revision: "2553ad1b66ee0956df02e9146dd78b93395f9f69"
      purpose: "VRAM-bounded H3 temporal chunking, spatial tiling, latent upscaling, refinement and stitching"
      depends_on:
        - "Comfyui_Minimax_h3_latent_Upscaler"
      required: true

  supporting:
    - name: "ComfyUI-VideoHelperSuite"
      repository: "https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git"
      revision: "4ee72c065db22c9d96c2427954dc69e7b908444b"
      purpose: "Video loading, saving and assembly support"
      required: true

policy:
  vendor_source_code: false
  clone_at_runtime: true
  third_party_models: false
  locked_project_model_inventory: true
  pin_revisions: true
