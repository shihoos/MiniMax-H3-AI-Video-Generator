    repository: https://github.com/SethRobinson/comfyui-workflow-to-api-converter-endpoint.git
    revision: bc8538278f82053b3ca10a44d62d02596f8e1a37
    purpose: Convert ComfyUI graph-format workflows to API prompt format
    required: true
  - name: H3-Optimizations
    repository: https://github.com/Zironic/H3-Optimizations.git
    revision: 379f9c7922b3d7831dd93ae069ba0cb82cf4cf36
    purpose: Production H3 memory/QKV/MLP optimization for T4-safe execution
    required: true
  supporting:
  - name: ComfyUI-VideoHelperSuite
    repository: https://github.com/Kosinkadink/ComfyUI-VideoHelperSuite.git
    revision: 4ee72c065db22c9d96c2427954dc69e7b908444b
