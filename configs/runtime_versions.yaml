python:
  ci: "3.11"
  kaggle: "3.12"

comfyui:
  expected_version: "0.33.0"

llama_cpp:
  package: "llama-cpp-python"
  version: "0.3.35"
  cuda_wheel: "cu130"
  cuda_index: "https://abetlen.github.io/llama-cpp-python/whl/cu130"

generation:
  width: 1344
  height: 768
  fps: 24
  frames_per_shot: 124
  normal_steps: 20
  turbo_steps: 8
  ref_image_size: "match"

upscale:
  # The H3 3D upscaler requires 32-pixel alignment.
  # 1920x1088 is therefore used as the internal refinement size
  # and is finally delivered at 1280x720.
  width: 1920
  height: 1088

delivery:
  width: 1280
  height: 720
  fps: 24

director:
  model_filename: "Qwen3-14B-Q4_K_M.gguf"
  context: 8192
  max_tokens: 7000
  temperature: 0.20
  top_p: 0.85
  batch: 512
  gpu_layers: -1
  threads: 8

storyboard:
  host: "0.0.0.0"
  port: 8765
