python:
  ci: '3.11'
  kaggle: '3.12'
  wrapt_version: 2.4.1
comfyui:
  repository: https://github.com/Comfy-Org/ComfyUI.git
  expected_version: 0.34.0
  revision: 12d5279438bfefc058a269eae805ceab6047777f
  h3_t4_value_clone_workaround: true
cuda_runtime:
  runtime_package: nvidia-cuda-runtime
  runtime_version: 13.3.29
  cublas_package: nvidia-cublas
  cublas_version: 13.6.1.10
generation:
  width: 1344
  height: 768
  fps: 24
  frames_per_shot: 124
  normal_steps: 20
  turbo_steps: 8
  ref2va_scheduler: beta
  turbo_scheduler: simple
  ref_image_size: match
upscale:
  width: 1920
  height: 1088
delivery:
  width: 1280
  height: 720
  fps: 24
director:
  model_path: /kaggle/input/qwen3-14b-awq
  format: safetensors-awq
  backend: vllm
  vllm_version: 0.31.0
  # vLLM 0.31.0 supports Transformers >=5.10.4,<5.18.0; the project's 5.17.0 pin is within range.
  allow_transformers_vllm_constraint_override: false
  vllm_env_dir:  /tmp/h3_qwen_vllm_031_tf517_tok0233
  context: 8192
  max_tokens: 7000
  story_max_tokens: 6500
  temperature: 0.2
  top_p: 0.85
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.9
  host: 127.0.0.1
  port: 8000
  max_num_seqs: 1
  speculative_method: eagle3
  speculative_model_path: /kaggle/input/eagle-3
  speculative_tokens: 2
  generation_config: vllm
  # Bounded Qwen3 hybrid story flow: reason about structure, then write clean prose.
  # Native thinking_token_budget is supported by this vLLM 0.31.0 runtime.
  story_architecture:
    # Total completion cap includes reasoning and the emitted cast + 12 scene beats.
    max_tokens: 2600
    thinking_token_budget: 1280
    beat_words_min: 45
    beat_words_max: 60
  # Two-stage story flow: Architect thinks/plans once; Author writes once without thinking.
  story_sampling:
    thinking:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
    shots:
      temperature: 0.6
      top_p: 0.9
    writing:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 1.5
      max_tokens: 3000
      # Keep zero: vLLM min_tokens suppresses EOS, not semantic under-length output.
      minimum_output_tokens: 0
  story_contract:
    scene_count: 12
    shots_per_scene: 3
    words_per_scene: 85
    target_words: 1020
    minimum_words: 816
    # Prompt-only overshoot; validation target remains 1,020 with an 816-word warning floor.
    writer_words_per_scene: 100
    # Single-generation policy: 612-word hard floor; 816-word target/minimum warns if missed.
    accept_min_words: 612
    minimum_active_characters: 3
    target_active_characters: 4
  prompt_limits:
    story_context_chars: 12000
    critic_story_context_chars: 3500
    shot_story_context_chars: 3000
    shot_scene_description_chars: 1500
    shot_scene_objective_chars: 220
    shot_scene_continuity_chars: 180
    shot_scene_atmosphere_chars: 180
storyboard:
  host: 0.0.0.0
  port: 8765
  gradio_version: 6.26.0
  pillow_version: 12.3.0
runtime:
  comfyui_startup_timeout_seconds: 300
  comfyui_request_timeout_seconds: 60
  comfyui_job_timeout_seconds: 14400
  comfyui_request_retries: 3
  lowvram: true
  cpu_vae: auto
  vram:
    profile: auto
    async_offload_streams: 2
    reserve_vram_gib: 0.0
    disable_pinned_memory: auto
    fast_disk: false
    ram_available_floor: 0.18
features:
  live_preview: true
  vlm_enabled: true
  qa_enabled: true
  context_ir_version: 2
  timeline_version: 1
  selective_retake: true
  director_critic: true
  auto_retake: true
  max_auto_retakes_per_shot: 1
  vlm_reference_analysis: true
  vlm_visual_qa: true
  preview_execution_mode: true
  diagnostic_execution_mode: true
  retake_execution_mode: true
  context_ir_required: true
  context_ir_backend: local_compiler
assembly:
  video_codec: libx264
  preset: medium
  crf: 17
  audio_codec: aac
  audio_bitrate: 192k
storage:
  keep_worker_logs: true
  keep_concat_file: false
pytorch:
  version: 2.10.0
  cuda: cu130
  index: https://download.pytorch.org/whl/cu130
  torchvision_version: 0.25.0
  torchaudio_version: 2.10.0
sage_attention:
  repository: https://github.com/THE-ANGEL-AI/SageAttention-SM75-path.git
  revision: 9f1c9a29be73abc3e92a56649bb24ce4278aea47
  version: 2.1.1-sm75.4
  directory: SageAttention-T4
  required: true
  smooth_k: true
  qk_quant_gran: per_warp
h3_optimization:
  repository: https://github.com/Zironic/H3-Optimizations.git
  revision: 379f9c7922b3d7831dd93ae069ba0cb82cb4cf36
  version: 0.2.41
  memory_optimization: true
  precision_mode: Preserve native
  qkv_streaming_mode: Auto
  attention_memory_mode: Lower VRAM (slower)
  chunk_rows: 2560
  sparse_attention: false
