python:
  ci: '3.11'
  kaggle: '3.12'
  wrapt_version: 2.4.1
comfyui:
  repository: https://github.com/Comfy-Org/ComfyUI.git
  expected_version: 0.43.2
  revision: 423cbd20511becb1f16122ab518e92e58bfa03d9
  h3_vae_decoder_dtype_patch: true
cuda_runtime:
  runtime_version: 13.2.86
  cublas_version: 13.4.1.3
generation:
  width: 1344
  height: 768
  fps: 24
  frames_per_shot: 141
  normal_steps: 20
  turbo_steps: 8
  ref2va_scheduler: beta
  turbo_scheduler: simple
  ref_image_size: match
upscale:
  width: 1920
  height: 1088
delivery:
  width: 1280
  height: 720
  fps: 24
director:
  model_path: /kaggle/input/qwen3-14b-awq
  format: safetensors-awq
  backend: vllm
  vllm_version: 0.33.0
  # One torch for the whole project: the Director venv runs the same torch/CUDA build as ComfyUI (pytorch.* below),
  # installed once and never replaced. The vLLM 0.33.0 wheel is a LibTorch Stable-ABI build, so it is installed with
  # --no-deps on top of the project torch and its other requirements are installed with torch held by constraints.
  # Verified on Kaggle 2xT4 with torch 2.15.0+cu132: vLLM kernels, Qwen3-14B-AWQ + EAGLE-3 TP=2 at the same speed.
  vllm_torch_version: 2.15.0
  vllm_cuda: cu132
  # CUDA toolkit the published vLLM wheel was built against (informational; no torch of that build is installed).
  vllm_wheel_build_cuda: cu130
  vllm_install_mode: stable_abi_no_deps
  # Single source of truth for the Director weight loader (bootstrap, preflight, planner and validators
  # all read this key). lazy = mmap from the staged local checkpoint copy; eager copies whole shards
  # into RAM per TP worker and ran the 33 GB Kaggle host out of memory.
  safetensors_load_strategy: lazy
  # Startup vs generation speed. enforce_eager=true: no torch.compile, CUDA graphs or JIT warmup (shortest
  # start, slowest generation). enforce_eager=false + jit_warmup=false: compile and graphs stay (fast
  # generation), only the ~50 s up-front Triton kernel warmup is skipped (kernels compile on first use).
  enforce_eager: false
  jit_warmup: false
  # Start the Director server in the background at the end of the bootstrap install chain, so its ~4 minute
  # start overlaps the SageAttention compile (CPU only) instead of running after the bootstrap. The server
  # is the same one the planner starts (same command), kept alive and reused; H3_DIRECTOR_PREWARM overrides.
  prewarm_during_bootstrap: true
  eager_ram_safety_factor: 1.25
  eager_ram_warning_reserve_gib: 4.0
  allow_transformers_vllm_constraint_override: false
  vllm_env_dir: /tmp/h3_qwen_vllm_033_torch215_tf517_tok0233
  context: 10240
  max_tokens: 7000
  story_max_tokens: 6500
  temperature: 0.2
  top_p: 0.85
  tensor_parallel_size: 2
  # 0.82, not 0.9: on torch 2.15/cu132 each worker already holds ~1.8 GiB of CUDA context when vLLM checks free memory,
  # so 0.9 (13.11 GiB) is refused at startup. 0.82 leaves ~4.2 GiB KV cache/GPU (53,920 tokens for a 10,240 context).
  gpu_memory_utilization: 0.82
  host: 127.0.0.1
  port: 8000
  max_num_seqs: 1
  speculative_method: eagle3
  speculative_model_path: /kaggle/input/eagle-3
  speculative_tokens: 2
  generation_config: vllm
  story_architecture:
    max_tokens: 5400
    thinking_token_budget: 1280
    beat_words_min: 55
    beat_words_max: 120
    structured_output: true
    revision_retries: 1
  story_sampling:
    thinking:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
    shots:
      temperature: 0.6
      top_p: 0.9
    writing:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.8
      max_tokens: 3800
      minimum_output_tokens: 0
  story_contract:
    scene_count: 12
    shots_per_scene: 3
    words_per_scene: 130
    target_words: 1560
    minimum_words: 1400
    writer_words_per_scene: 190
    accept_min_words: 1400
    cast_size_policy: plot_driven
    author_revision_retries: 1
  prompt_limits:
    story_context_chars: 12000
    critic_story_context_chars: 3500
    shot_story_context_chars: 3000
    shot_scene_description_chars: 1500
    shot_scene_objective_chars: 220
    shot_scene_continuity_chars: 180
    shot_scene_atmosphere_chars: 180
storyboard:
  host: 0.0.0.0
  port: 8765
  gradio_version: 6.31.0
  # Installed last with --no-deps because Gradio 6.31.0 still declares Pillow<13;
  # Pillow 13.0.0 is the patched release for CVE-2026-112403.
  pillow_version: 13.0.0
runtime:
  comfyui_startup_timeout_seconds: 300
  comfyui_request_timeout_seconds: 60
  comfyui_job_timeout_seconds: 14400
  comfyui_request_retries: 3
  lowvram: true
  cpu_vae: auto
  vram:
    profile: auto
    async_offload_streams: 2
    reserve_vram_gib: 0.0
    disable_pinned_memory: auto
    fast_disk: false
    ram_available_floor: 0.18
features:
  live_preview: true
  vlm_enabled: true
  qa_enabled: true
  context_ir_version: 2
  timeline_version: 1
  selective_retake: true
  director_critic: true
  auto_retake: true
  max_auto_retakes_per_shot: 1
  vlm_reference_analysis: true
  vlm_visual_qa: true
  preview_execution_mode: true
  diagnostic_execution_mode: true
  retake_execution_mode: true
  context_ir_required: true
  context_ir_backend: local_compiler
assembly:
  video_codec: libx264
  preset: medium
  crf: 17
  audio_codec: aac
  audio_bitrate: 192k
storage:
  keep_worker_logs: true
  keep_concat_file: false
pytorch:
  # PyTorch 2.15 is the latest stable release. It publishes CUDA 13.2 (not cu130)
  # wheels and retains Turing/SM75 support. Require the CUDA 13 minimum driver.
  version: 2.15.0
  cuda: cu132
  index: https://download.pytorch.org/whl/cu132
  torchvision_version: 0.29.2+cu132
  # TorchAudio 2.11.1 uses the stable PyTorch ABI and supports Torch >=2.11.
  torchaudio_version: 2.11.1+cu132
  minimum_driver_version: '580.00'
sage_attention:
  repository: https://github.com/THE-ANGEL-AI/SageAttention-SM75-path.git
  revision: 9f1c9a29be73abc3e92a56649bb24ce4278aea47
  version: 2.1.1-sm75.4
  directory: SageAttention-T4
  required: true
  smooth_k: true
  qk_quant_gran: per_warp
h3_optimization:
  repository: https://github.com/Zironic/H3-Optimizations.git
  revision: 379f9c7922b3d7831dd93ae069ba0cb82cb4cf36
  version: 0.2.41
  memory_optimization: true
  precision_mode: Preserve native
  qkv_streaming_mode: Auto
  attention_memory_mode: Lower VRAM (slower)
  chunk_rows: 2560
