python:
  ci: '3.11'
  kaggle: '3.12'
  wrapt_version: 2.4.1
comfyui:
  repository: https://github.com/Comfy-Org/ComfyUI.git
  expected_version: 0.43.2
  revision: 423cbd20511becb1f16122ab518e92e58bfa03d9
  h3_vae_decoder_dtype_patch: true
cuda_runtime:
  runtime_version: 13.3.29
  cublas_version: 13.6.1.10
generation:
  width: 1344
  height: 768
  fps: 24
  frames_per_shot: 141
  normal_steps: 20
  turbo_steps: 8
  ref2va_scheduler: beta
  turbo_scheduler: simple
  ref_image_size: match
upscale:
  width: 1920
  height: 1088
delivery:
  width: 1280
  height: 720
  fps: 24
director:
  model_path: /kaggle/input/qwen3-14b-awq
  format: safetensors-awq
  backend: vllm
  vllm_version: 0.32.0
  # The vLLM runtime is isolated from ComfyUI and uses its CUDA 13.0 / PyTorch 2.13.0 stack.
  vllm_torch_version: 2.13.0
  vllm_cuda: cu130
  safetensors_load_strategy: eager
  eager_ram_safety_factor: 1.25
  eager_ram_warning_reserve_gib: 4.0
  # vLLM 0.32.0 accepts Transformers 5.16.1-5.19.x and tokenizers >=0.23.2.
  allow_transformers_vllm_constraint_override: false
  vllm_env_dir: /tmp/h3_qwen_vllm_032_tf517_tok0233
  context: 10240
  max_tokens: 7000
  story_max_tokens: 6500
  temperature: 0.2
  top_p: 0.85
  tensor_parallel_size: 2
  gpu_memory_utilization: 0.9
  host: 127.0.0.1
  port: 8000
  max_num_seqs: 1
  speculative_method: eagle3
  speculative_model_path: /kaggle/input/eagle-3
  speculative_tokens: 2
  generation_config: vllm
  # Bounded Qwen3 hybrid story flow: reason about structure, then write clean prose.
  # Native thinking_token_budget is supported by the pinned vLLM 0.32.0 runtime.
  story_architecture:
    # Total completion cap includes reasoning and the emitted cast + 12 scene beats.
    max_tokens: 3600
    thinking_token_budget: 1280
    # The Architect returns compact causal beats plus explicit plot-engine and per-scene continuity fields.
    # This keeps the planning pass focused and avoids spending tokens on a rigid template.
    beat_words_min: 55
    beat_words_max: 120
  # Two-stage story flow: Architect thinks/plans once; Author writes once without thinking.
  story_sampling:
    thinking:
      temperature: 0.6
      top_p: 0.95
      top_k: 20
      min_p: 0.0
    shots:
      temperature: 0.6
      top_p: 0.9
    writing:
      temperature: 0.7
      top_p: 0.8
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.8
      max_tokens: 3000
      # Keep zero: vLLM min_tokens suppresses EOS, not semantic under-length output.
      minimum_output_tokens: 0
  story_contract:
    scene_count: 12
    shots_per_scene: 3
    words_per_scene: 130
    target_words: 1560
    # Hard minimum: generated AI/Expand stories must contain at least 1,400 usable words.
    minimum_words: 1400
    # Stretch guidance, not a quota: allow longer scenes when the causal story needs room.
    writer_words_per_scene: 145
    # Must match minimum_words; below-floor output fails without retry or repair.
    accept_min_words: 1400
    # The narrative determines the cast size; no numeric minimum, target, or maximum.
    cast_size_policy: plot_driven
  prompt_limits:
    story_context_chars: 12000
    critic_story_context_chars: 3500
    shot_story_context_chars: 3000
    shot_scene_description_chars: 1500
    shot_scene_objective_chars: 220
    shot_scene_continuity_chars: 180
    shot_scene_atmosphere_chars: 180
storyboard:
  host: 0.0.0.0
  port: 8765
  gradio_version: 6.26.0
  pillow_version: 12.3.0
runtime:
  comfyui_startup_timeout_seconds: 300
  comfyui_request_timeout_seconds: 60
  comfyui_job_timeout_seconds: 14400
  comfyui_request_retries: 3
  lowvram: true
  cpu_vae: auto
  vram:
    profile: auto
    async_offload_streams: 2
    reserve_vram_gib: 0.0
    disable_pinned_memory: auto
    fast_disk: false
    ram_available_floor: 0.18
features:
  live_preview: true
  vlm_enabled: true
  qa_enabled: true
  context_ir_version: 2
  timeline_version: 1
  selective_retake: true
  director_critic: true
  auto_retake: true
  max_auto_retakes_per_shot: 1
  vlm_reference_analysis: true
  vlm_visual_qa: true
  preview_execution_mode: true
  diagnostic_execution_mode: true
  retake_execution_mode: true
  context_ir_required: true
  context_ir_backend: local_compiler
assembly:
  video_codec: libx264
  preset: medium
  crf: 17
  audio_codec: aac
  audio_bitrate: 192k
storage:
  keep_worker_logs: true
  keep_concat_file: false
pytorch:
  version: 2.10.0
  cuda: cu130
  index: https://download.pytorch.org/whl/cu130
  torchvision_version: 0.25.0
  torchaudio_version: 2.10.0
sage_attention:
  repository: https://github.com/THE-ANGEL-AI/SageAttention-SM75-path.git
  revision: 9f1c9a29be73abc3e92a56649bb24ce4278aea47
  version: 2.1.1-sm75.4
  directory: SageAttention-T4
  required: true
  smooth_k: true
  qk_quant_gran: per_warp
h3_optimization:
  repository: https://github.com/Zironic/H3-Optimizations.git
  revision: 379f9c7922b3d7831dd93ae069ba0cb82cb4cf36
  version: 0.2.41
  memory_optimization: true
  precision_mode: Preserve native
  qkv_streaming_mode: Auto
  attention_memory_mode: Lower VRAM (slower)
  chunk_rows: 2560
