models:

  diffusion_model:
    filename: "minimax_h3_ref2va_pruned_int8_convrot.safetensors"
    directory: "diffusion_models"
    required: true
    purpose: "Primary MiniMax H3 Ref2VA generation"

  text_encoder:
    filename: "qwen3vl_32b_minimax_h3_int4_convrot.safetensors"
    directory: "text_encoders"
    required: true
    purpose: "MiniMax H3 Qwen3-VL-32B multimodal conditioning encoder"

  turbo_lora:
    filename: "minimax_h3_turbo_v4_step600_ema.safetensors"
    directory: "loras"
    required: true
    purpose: "H3 Turbo Step600 LoRA"

  video_vae:
    filename: "minimax_h3_video_vae_fp16.safetensors"
    directory: "vae"
    required: true
    purpose: "MiniMax H3 video VAE"

  audio_vae:
    filename: "minimax_h3_audio_vae_fp32.safetensors"
    directory: "vae"
    required: true
    purpose: "MiniMax H3 audio VAE"

  latent_upscaler:
    filename: "minimax_h3_latent_upscaler_3d_fp16.safetensors"
    directory: "latent_upscale_models"
    required: true
    purpose: "MiniMax H3 3D latent upscaler"


policy:

  # The ComfyUI production inventory remains exact.
  exact_inventory: true

  # Do not allow arbitrary additional ComfyUI production models.
  allow_extra_production_models: false

  # Do not allow arbitrary GGUF/Q4 model files inside
  # ComfyUI/models.
  allow_q4_models: false

  # The director Qwen is explicitly allowed, but it is
  # outside the ComfyUI production model inventory.
  allow_director_qwen: true

  director_model:
    filename: "Qwen3-14B-Q4_K_M.gguf"
    runtime: "llama-cpp-python"
    purpose: >
      Local story writer, character planner,
      scene planner, shot planner and cinematic director.
    loaded_during:
      - planning
    unloaded_before:
      - h3_generation
      - upscale
      - final_assembly

  # No additional Qwen model is required.
  # The existing H3 Qwen3-VL checkpoint remains the
  # multimodal H3 conditioning encoder.
  allow_additional_qwen_models: false

  allow_separate_upscaler_dataset: false
