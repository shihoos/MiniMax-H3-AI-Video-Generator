name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimax-h3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:

    name: H3 Production Validation

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            ui

      - name: Reference path wiring
        run: |
          python scripts/validate_reference_wiring.py

      - name: Project validator
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_project.py

      - name: Director validation
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_director.py

      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          cases = [
              (
                  "ai_story",
                  "A scientist discovers a strange signal beneath a ruined city.",
              ),
              (
                  "expand_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
              (
                  "preserve_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
          ]

          for mode, story in cases:

              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert isinstance(
                  plan,
                  dict,
              )

              assert "scenes" in plan
              assert "shots" in plan

          print(
              "Planner smoke tests PASSED."
          )
          PY

      - name: Runtime import integration
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          modules = [
              "planner.production_planner",
              "planner.qwen_director",
              "pipeline.production_orchestrator",
              "pipeline.identity_anchor_store",
              "pipeline.h3_scene_continuity",
              "execution.h3_workflow_builder",
              "execution.h3_upscaled_workflow_builder",
              "execution.shot_executor",
              "execution.production_runner",
              "execution.h3_runtime",
              "execution.assembly_manager",
              "scheduler.gpu_scheduler",
              "ui.storyboard_gradio",
          ]

          for module in modules:
              __import__(module)

          print(
              "Runtime imports PASSED."
          )
          PY

      - name: Gradio UI contract
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "ui/storyboard_gradio.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "ProductionController",
              "generate_storyboard",
              "preview_saved",
              "preview_latest_for_mode",
              "_saved_drafts",
              "Approve & Generate Video",
          ]

          for token in required:
              assert token in text, token

          assert (
              "Qwen director returned no usable characters"
              not in text
          )

          print(
              "Gradio UI contract PASSED."
          )
          PY

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
