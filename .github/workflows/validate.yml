name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:

  validate:

    name: H3 Production Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML


      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            ui


      - name: Project validator
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_project.py


      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          tests = {
              "preserve_user_story":
                  "A detective enters an abandoned railway station at midnight.",

              "expand_user_story":
                  "A detective enters an abandoned railway station.",

              "ai_story":
                  "A scientist discovers a strange signal beneath an abandoned city.",
          }

          for mode, story in tests.items():

              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert plan["scenes"]
              assert plan["shots"]

              assert plan["width"] == 1344
              assert plan["height"] == 768
              assert plan["fps"] == 24
              assert plan["normal_steps"] == 20
              assert plan["turbo_steps"] == 8

          print(
              "Planner smoke tests PASSED."
          )
          PY


      - name: Runtime import integration
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          modules = [
              "planner.production_planner",
              "planner.qwen_director",
              "pipeline.production_orchestrator",
              "pipeline.identity_anchor_store",
              "pipeline.h3_scene_continuity",
              "execution.h3_workflow_builder",
              "execution.h3_upscaled_workflow_builder",
              "execution.shot_executor",
              "execution.production_runner",
              "execution.h3_runtime",
              "execution.assembly_manager",
              "ui.storyboard_server",
          ]

          for module in modules:
              __import__(module)

          print(
              "Production runtime imports PASSED."
          )
          PY


      - name: Director configuration
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.config import (
              DIRECTOR_MODEL_FILENAME,
              DELIVERY_WIDTH,
              DELIVERY_HEIGHT,
              UPSCALE_WIDTH,
              UPSCALE_HEIGHT,
          )

          assert (
              DIRECTOR_MODEL_FILENAME
              == "Qwen3-14B-Q4_K_M.gguf"
          )

          assert (
              DELIVERY_WIDTH,
              DELIVERY_HEIGHT
          ) == (
              1280,
              720,
          )

          assert (
              UPSCALE_WIDTH,
              UPSCALE_HEIGHT
          ) == (
              1920,
              1088,
          )

          print(
              "Director configuration PASSED."
          )
          PY


      - name: Storyboard UI contract
        run: |
          python - <<'PY'
          from pathlib import Path

          html = Path(
              "ui/storyboard.html"
          )

          server = Path(
              "ui/storyboard_server.py"
          )

          assert html.is_file()
          assert server.is_file()

          text = html.read_text(
              encoding="utf-8"
          )

          for token in [
              "Approve Storyboard",
              "Save Draft",
              "characters",
              "scenes",
              "shots",
              "camera_shot",
              "camera_movement",
              "lighting",
              "overall_soundscape",
          ]:
              assert token in text, token

          print(
              "Storyboard UI PASSED."
          )
          PY


      - name: Combined upscale contract
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from execution.h3_upscaled_workflow_builder import (
              H3UpscaledWorkflowBuilder,
          )

          assert hasattr(
              H3UpscaledWorkflowBuilder,
              "build_upscaled",
          )

          print(
              "Combined H3 upscale builder PASSED."
          )
          PY


      - name: Workflow contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path(
                  "workflows/generation/"
                  "H3_Ref2V_Production.json"
              ),
              Path(
                  "workflows/generation/"
                  "H3_Turbo_Ref2V_Production.json"
              ),
              Path(
                  "workflows/postprocess/"
                  "H3_Ref2V_UltimateUpscale_Production.json"
              ),
              Path(
                  "workflows/sources/"
                  "H3_Turbo_Reference_Source.json"
              ),
              Path(
                  "workflows/sources/"
                  "H3_LatentUpscaler_Source.json"
              ),
          ]

          for path in paths:

              data = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              assert isinstance(
                  data,
                  dict,
              )

              assert isinstance(
                  data.get("nodes"),
                  list,
              )

          turbo = json.loads(
              paths[1].read_text(
                  encoding="utf-8"
              )
          )

          turbo_text = json.dumps(
              turbo
          )

          assert (
              "minimax_h3_turbo_v4_step600_ema.safetensors"
              in turbo_text
          )

          assert (
              "minimax_h3_ref2v_turbo_4step"
              not in turbo_text
          )

          upscale = json.loads(
              paths[2].read_text(
                  encoding="utf-8"
              )
          )

          upscale_types = {
              node.get("type")
              for node in upscale["nodes"]
          }

          for required in [
              "MMH3LatentUpscaleWithModelParams",
              "MMH3TemporalSplitParams",
              "MMH3SpatialSplitParams",
              "MMH3UltimateUpscale",
          ]:
              assert required in upscale_types, required

          print(
              "Workflow contracts PASSED."
          )
          PY


      - name: Repository cleanup
        run: |
          if find . \
            -type f \
            -name '*_TEST.json' \
            -print \
            -quit | grep -q .; then
            echo "Temporary workflow artifact found."
            exit 1
          fi

          test ! -e workflows/generation/aa
          test ! -e workflows/sources/a


      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
