name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: H3 Repository Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle

      - name: Project validator
        run: |
          python scripts/validate_project.py

      - name: Planner smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          root = Path(".").resolve()

          planner = ProductionPlanner(root)

          plan = planner.build(
              mode="preserve_user_story",
              user_input=(
                  "A young explorer walks through "
                  "a city street at sunset."
              ),
              workflow_mode="ref2v",
              profile="base",
          )

          assert plan["shots"]
          assert plan["scenes"]
          assert plan["characters"]

          for shot in plan["shots"]:
              assert shot["width"] % 32 == 0
              assert shot["height"] % 32 == 0
              assert shot["fps"] == 24

          print(
              "Planner smoke test PASSED."
          )
          PY

      - name: Workflow inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          production = [
              Path(
                  "workflows/generation/"
                  "H3_Ref2V_Production.json"
              ),
              Path(
                  "workflows/generation/"
                  "H3_Turbo_Ref2V_Production.json"
              ),
              Path(
                  "workflows/postprocess/"
                  "H3_Ref2V_UltimateUpscale_Production.json"
              ),
          ]

          sources = [
              Path(
                  "workflows/sources/"
                  "H3_Turbo_Reference_Source.json"
              ),
              Path(
                  "workflows/sources/"
                  "H3_LatentUpscaler_Source.json"
              ),
          ]

          for path in production + sources:
              assert path.is_file(), path

              data = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              assert isinstance(
                  data,
                  dict,
              )

              assert data.get("nodes")

              assert isinstance(
                  data.get("links", []),
                  list,
              )

              print(
                  "PASS",
                  path,
                  "nodes=",
                  len(data["nodes"]),
                  "links=",
                  len(data.get("links", [])),
              )
          PY

      - name: Runtime manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "configs/custom_nodes.yaml"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "Comfyui_Minimax_h3_latent_Upscaler",
              "Comfyui-MMH3-UltimateUpscale",
              "ComfyUI-MiniMax-H3-Turbo",
              "ComfyUI-Workflow-To-API-Converter",
              "ComfyUI-VideoHelperSuite",
          ]

          for name in required:
              assert name in text, name
              print(
                  "PASS",
                  name,
              )
          PY

      - name: Repository cleanup
        run: |
          test ! -e workflows/generation/aa
          test ! -e workflows/sources/a
          ! find . -type f -name '*_TEST.json' | grep -q .

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
