name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimax-h3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:

    name: H3 Production Validation (Python ${{ matrix.python-version }})

    runs-on: ubuntu-latest

    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            ui

      - name: Dependency manifest contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import yaml

          requirements = Path("requirements.txt").read_text(encoding="utf-8")
          runtime = yaml.safe_load(
              Path("configs/runtime_versions.yaml").read_text(encoding="utf-8")
          )

          assert re.search(r"(?im)^Pillow(?:==|>=|>|~=|<=)", requirements), \
              "requirements.txt must declare Pillow."

          pillow_requirement = str(
              runtime.get("storyboard", {}).get("pillow_requirement", "")
          ).strip()

          assert pillow_requirement, \
              "runtime_versions.yaml must declare storyboard.pillow_requirement."

          assert f"Pillow{pillow_requirement}" in requirements, \
              "Pillow requirement must match runtime_versions.yaml."

          print("Dependency manifest contract PASSED.")
          PY

      - name: Reference path wiring
        run: |
          python scripts/validate_reference_wiring.py

      - name: Project validator
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_project.py

      - name: Runtime install contract
        run: |
          python scripts/validate_runtime_contract.py

      - name: Director validation
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_director.py

      - name: Production continuity validation
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_production_continuity.py

      - name: H3 duration quantization contract
        run: |
          python - <<'PY'
          from pipeline.dialogue_timeline import DialogueTimeline

          assert DialogueTimeline.h3_legal_frames(5.0) == 124
          assert abs(
              DialogueTimeline.h3_effective_duration_seconds(5.0)
              - (124 / 24.0)
          ) < 1e-9
          assert DialogueTimeline.h3_legal_frames(4.0) == 124
          assert DialogueTimeline.h3_legal_frames(15.0) == 362
          assert DialogueTimeline.h3_legal_frames(5.2) == 141

          print("H3 duration quantization contract PASSED.")
          PY

      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          cases = [
              (
                  "ai_story",
                  "A scientist discovers a strange signal beneath a ruined city.",
              ),
              (
                  "expand_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
              (
                  "preserve_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
          ]

          for mode, story in cases:

              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert isinstance(
                  plan,
                  dict,
              )

              assert "scenes" in plan
              assert "shots" in plan

          print(
              "Planner smoke tests PASSED."
          )
          PY

      - name: Runtime import integration
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          modules = [
              "planner.production_planner",
              "planner.qwen_director",
              "pipeline.production_orchestrator",
              "pipeline.identity_anchor_store",
              "pipeline.h3_scene_continuity",
              "pipeline.dialogue_timeline",
              "pipeline.continuity_ledger",
              "pipeline.storyboard_reference_builder",
              "execution.h3_workflow_builder",
              "execution.h3_upscaled_workflow_builder",
              "execution.shot_executor",
              "execution.production_runner",
              "execution.h3_runtime",
              "execution.assembly_manager",
              "scheduler.gpu_scheduler",
              "ui.storyboard_gradio",
          ]

          for module in modules:
              __import__(module)

          print(
              "Runtime imports PASSED."
          )
          PY

      - name: Direct Gradio entry-point smoke
        env:
          H3_DIRECTOR_ENABLED: "0"
        shell: bash
        run: |
          set +e
          timeout 12s python ui/storyboard_gradio.py > /tmp/h3_gradio_entry.log 2>&1
          status=$?
          set -e

          if ! grep -Eq "Running on local URL|Running on public URL" /tmp/h3_gradio_entry.log; then
            cat /tmp/h3_gradio_entry.log
            echo "Direct Gradio entry-point smoke FAILED."
            exit 1
          fi

          if [ "$status" -ne 0 ] && [ "$status" -ne 124 ]; then
            cat /tmp/h3_gradio_entry.log
            echo "Direct Gradio entry-point exited unexpectedly with status $status."
            exit 1
          fi

          echo "Direct Gradio entry-point smoke PASSED."

      - name: Gradio UI contract
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "ui/storyboard_gradio.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "ProductionController",
              "generate_storyboard",
              "preview_saved",
              "preview_latest_for_mode",
              "_saved_drafts",
              "Approve & Generate Video",
          ]

          for token in required:
              assert token in text, token

          assert (
              "Qwen director returned no usable characters"
              not in text
          )

          print(
              "Gradio UI contract PASSED."
          )
          PY

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
