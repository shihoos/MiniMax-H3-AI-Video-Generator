name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: H3 Repository Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            compatibility

      - name: H3 project validation
        run: |
          python scripts/validate_project.py

      - name: Workflow inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("workflows")

          production = [
              root / "generation" / "H3_Ref2V_Production.json",
              root / "generation" / "H3_Turbo_Ref2V_Production.json",
              root / "postprocess" / "H3_Ref2V_UltimateUpscale_Production.json",
          ]

          sources = [
              root / "sources" / "H3_Turbo_Reference_Source.json",
              root / "sources" / "H3_LatentUpscaler_Source.json",
          ]

          for path in production + sources:
              assert path.is_file(), path
              data = json.loads(path.read_text())
              assert isinstance(data, dict)
              assert data.get("nodes")
              print(
                  f"PASS {path} "
                  f"nodes={len(data['nodes'])} "
                  f"links={len(data.get('links', []))}"
              )
          PY

      - name: Repository cleanliness
        run: |
          test ! -e workflows/generation/aa
          test ! -e workflows/sources/a
          ! find workflows -type f -name '*_TEST.json' | grep -q .

      - name: Runtime manifest check
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "configs/custom_nodes.yaml"
          ).read_text()

          required = [
              "Comfyui_Minimax_h3_latent_Upscaler",
              "Comfyui-MMH3-UltimateUpscale",
              "ComfyUI-MiniMax-H3-Turbo",
              "ComfyUI-Workflow-To-API-Converter",
              "ComfyUI-VideoHelperSuite",
          ]

          for name in required:
              assert name in text, name
              print("PASS", name)
          PY

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
