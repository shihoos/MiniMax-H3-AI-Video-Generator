name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimax-h3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: H3 Production Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify installed dependency consistency
        run: |
          python -m pip check

      - name: Verify required dependencies
        run: |
          python - <<'PY'
          import importlib

          required_modules = [
              "yaml",
              "gradio",
              "PIL",
              "websocket",
          ]

          for module in required_modules:
              importlib.import_module(module)

          print("Required dependencies PASSED.")
          PY

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            ui

      - name: Reference path wiring
        run: |
          python scripts/validate_reference_wiring.py

      - name: Project validator
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_project.py

      - name: H3 semantic workflow topology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8")
              )

          def node_types(graph, kind):
              return [
                  n for n in graph.get("nodes", [])
                  if n.get("type") == kind
              ]

          def outgoing_targets(graph, source_id):
              nodes = {
                  int(n["id"]): n
                  for n in graph.get("nodes", [])
              }
              targets = []
              for row in graph.get("links", []):
                  if not isinstance(row, list) or len(row) < 5:
                      continue
                  if int(row[1]) != int(source_id):
                      continue
                  target = nodes.get(int(row[3]))
                  if target is not None:
                      targets.append(target)
              return targets

          turbo = load(
              "workflows/generation/H3_Turbo_Ref2VA_Production.json"
          )
          lora = node_types(turbo, "MiniMaxH3TurboLoRA")
          optimizer = node_types(turbo, "H3MemoryOptimization")

          assert len(lora) == 1, "Turbo must contain exactly one TurboLoRA."
          assert len(optimizer) == 1, "Turbo must contain exactly one H3MemoryOptimization."

          lora_targets = outgoing_targets(turbo, lora[0]["id"])
          assert any(
              n.get("type") == "H3MemoryOptimization"
              for n in lora_targets
          ), "TurboLoRA must feed H3MemoryOptimization."

          optimizer_targets = outgoing_targets(
              turbo,
              optimizer[0]["id"],
          )
          optimizer_target_types = {
              n.get("type")
              for n in optimizer_targets
          }
          assert "BasicScheduler" in optimizer_target_types
          assert "BasicGuider" in optimizer_target_types

          upscale = load(
              "workflows/postprocess/H3_Ref2VA_UltimateUpscale_Production.json"
          )
          upscale_optimizer = node_types(
              upscale,
              "H3MemoryOptimization",
          )
          assert len(upscale_optimizer) == 1, (
              "Upscale must contain exactly one H3MemoryOptimization."
          )

          upscale_targets = outgoing_targets(
              upscale,
              upscale_optimizer[0]["id"],
          )
          upscale_target_types = {
              n.get("type")
              for n in upscale_targets
          }
          assert "BasicScheduler" in upscale_target_types
          assert "BasicGuider" in upscale_target_types
          assert "MMH3UltimateUpscale" in upscale_target_types

          print("H3 semantic workflow topology PASSED.")
          PY

      - name: Runtime install contract
        run: |
          python scripts/validate_runtime_contract.py

      - name: Director validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_director.py

      - name: Production continuity validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          test -f scripts/validate_production_continuity.py
          python scripts/validate_production_continuity.py

      - name: Production scale validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_production_scale.py

      - name: Enhancement validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_enhancements.py

      - name: Plan persistence race regression
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_plan_persistence.py

      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          cases = [
              (
                  "ai_story",
                  "A scientist discovers a strange signal beneath a ruined city.",
              ),
              (
                  "expand_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
              (
                  "preserve_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
          ]

          for mode, story in cases:
              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2va",
                  profile="base",
              )

              assert isinstance(plan, dict)
              assert "scenes" in plan
              assert "shots" in plan

          print("Planner smoke tests PASSED.")
          PY

      - name: Runtime import integration
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          modules = [
              "planner.production_planner",
              "planner.qwen_director",
              "pipeline.production_orchestrator",
              "pipeline.identity_anchor_store",
              "pipeline.h3_scene_continuity",
              "pipeline.dialogue_duration",
              "pipeline.dialogue_timeline",
              "pipeline.continuity_ledger",
              "pipeline.storyboard_reference_builder",
              "execution.h3_workflow_builder",
              "execution.h3_upscaled_workflow_builder",
              "execution.shot_executor",
              "execution.production_runner",
              "execution.h3_runtime",
              "execution.assembly_manager",
              "scheduler.gpu_scheduler",
              "schemas.dialogue",
              "schemas.shot",
              "schemas.character",
              "pipeline.timeline",
              "pipeline.vlm_analyzer",
              "pipeline.visual_feedback",
              "pipeline.quality_gate",
              "pipeline.retake_manager",
              "pipeline.runtime_diagnostics",
              "pipeline.context_ir",
              "pipeline.production_manifest",
              "ui.storyboard_gradio",
          ]

          for module in modules:
              __import__(module)

          print("Runtime imports PASSED.")
          PY

      - name: SQLite heartbeat threading regression
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          import tempfile
          import threading
          from pathlib import Path

          from pipeline.job_queue import ProductionJobQueue

          with tempfile.TemporaryDirectory(prefix="h3-jobqueue-") as td:
              root = Path(td)
              plan_path = root / "plan.json"
              plan_path.write_text("{}", encoding="utf-8")

              queue = ProductionJobQueue(
                  root / "jobs.sqlite3"
              )

              job_id = queue.submit(
                  production_id="validator-production",
                  plan_path=plan_path,
                  payload={},
              )

              claimed = queue.claim_next()
              assert claimed is not None
              assert claimed["job_id"] == job_id

              worker_token = str(
                  claimed["worker_token"]
              )

              errors = []

              def heartbeat():
                  try:
                      assert queue.heartbeat(
                          job_id,
                          worker_token,
                      )
                  except Exception as exc:
                      errors.append(exc)

              thread = threading.Thread(
                  target=heartbeat,
                  name="validator-heartbeat",
                  daemon=True,
              )
              thread.start()
              thread.join(timeout=10)

              assert not thread.is_alive()
              assert not errors, errors

          print("SQLite heartbeat threading regression PASSED.")
          PY

      - name: Continuity architecture contract
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          import ast
          import re
          from pathlib import Path

          orchestrator = Path(
              "pipeline/production_orchestrator.py"
          ).read_text(encoding="utf-8")

          runner = Path(
              "execution/production_runner.py"
          ).read_text(encoding="utf-8")

          shot = Path(
              "schemas/shot.py"
          ).read_text(encoding="utf-8")

          gradio = Path(
              "ui/storyboard_gradio.py"
          ).read_text(encoding="utf-8")

          queue = Path(
              "pipeline/job_queue.py"
          ).read_text(encoding="utf-8")

          validate = Path(
              "scripts/validate_project.py"
          ).read_text(encoding="utf-8")

          def find_function(tree, name):
              for node in ast.walk(tree):
                  if isinstance(node, ast.FunctionDef) and node.name == name:
                      return node
              return None

          # Deterministic enforcement after Qwen unload.
          orchestrator_tree = ast.parse(
              orchestrator,
              filename="pipeline/production_orchestrator.py",
          )
          enforce = find_function(
              orchestrator_tree,
              "_enforce_production_contracts",
          )
          assert enforce is not None
          enforce_body = ast.unparse(enforce)
          assert "repair_continuity_violation" not in enforce_body
          assert "apply_field_level_fallback" in enforce_body

          # Manifest writes remain locked.
          assert "self._manifest_lock = threading.RLock()" in runner
          assert "with self._manifest_lock" in runner

          # Structured Shot continuity/dialogue contract.
          assert "continuity_start_state" in shot
          assert "continuity_end_state" in shot
          assert "dialogue_events" in shot

          # Validator must explicitly require the optimizer in both contracts.
          turbo_start = validate.find("turbo_required")
          upscale_start = validate.find("upscale_required")
          assert turbo_start >= 0
          assert upscale_start > turbo_start
          assert '"H3MemoryOptimization"' in validate[turbo_start:upscale_start]
          assert '"H3MemoryOptimization"' in validate[upscale_start:]
          assert '"schemas/dialogue.py"' in validate

          # SQLite uses operation-scoped connections. Never suppress
          # sqlite's cross-thread protection to hide connection sharing.
          assert "def _connect(self):" in queue
          assert "sqlite3.connect(" in queue
          assert "check_same_thread=False" not in queue

          # Production execution waits on the controller lock and only
          # releases it when the current call acquired it.
          gradio_tree = ast.parse(
              gradio,
              filename="ui/storyboard_gradio.py",
          )
          execute_fn = find_function(
              gradio_tree,
              "_execute_approved_plan",
          )
          assert execute_fn is not None
          execute_body = ast.unparse(execute_fn)
          assert "lock_acquired = self._lock.acquire(timeout=3600.0)" in execute_body
          assert "if not lock_acquired:" in execute_body
          assert "if lock_acquired:" in execute_body
          assert "blocking=False" not in execute_body

          # Live preview is supported but automatic polling starts disabled.
          assert re.search(
              r"gr\.Timer\(\s*value\s*=\s*3\.0\s*,\s*active\s*=\s*False\s*\)",
              gradio,
          )
          assert "refresh_live_preview.click(" in gradio
          assert "live_preview_timer.tick(" in gradio
          assert "Live H3 Sampling Preview" in gradio
          assert "Refresh Live Preview" in gradio

          # H3 continuity state is prose-formatted, not direct JSON dumps.
          assert "_state_summary(" in shot
          assert not re.search(
              r"json\.dumps\(\s*self\.continuity_start_state\b",
              shot,
              flags=re.DOTALL,
          )
          assert not re.search(
              r"json\.dumps\(\s*self\.continuity_end_state\b",
              shot,
              flags=re.DOTALL,
          )

          print("Continuity architecture contract PASSED.")
          PY

      - name: Gradio UI contract
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "ui/storyboard_gradio.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "ProductionController",
              "generate_storyboard",
              "preview_saved",
              "preview_latest_for_mode",
              "_saved_drafts",
              "Approve & Generate Video",
          ]

          for token in required:
              assert token in text, token

          assert (
              "Qwen director returned no usable characters"
              not in text
          )

          # The UI must respect a CI-supplied director-disabled environment.
          assert (
              'os.environ.setdefault("H3_DIRECTOR_ENABLED", "1")'
              in text
              or
              "os.environ.setdefault('H3_DIRECTOR_ENABLED', '1')"
              in text
          )

          print(
              "Gradio UI contract PASSED."
          )
          PY

      - name: Direct Gradio entry-point smoke
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
          GRADIO_ANALYTICS_ENABLED: "False"
        shell: bash
        run: |
          set -u

          rm -f /tmp/h3_gradio_entry.log

          python -u ui/storyboard_gradio.py \
            > /tmp/h3_gradio_entry.log 2>&1 &

          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          ready=0

          for _ in $(seq 1 30); do
            if curl -fsS \
              --max-time 2 \
              http://127.0.0.1:8765/ \
              >/dev/null 2>&1; then
              ready=1
              break
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Direct Gradio entry-point smoke FAILED."
            echo "--- Gradio entry-point log ---"
            cat /tmp/h3_gradio_entry.log || true
            echo "--- end log ---"
            exit 1
          fi

          echo "Direct Gradio entry-point smoke PASSED."

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
