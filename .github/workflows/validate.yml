name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimax-h3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:

    name: H3 Production Validation

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML gradio

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            ui

      - name: Reference path wiring
        run: |
          python scripts/validate_reference_wiring.py

      - name: Project validator
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_project.py

      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          cases = [
              (
                  "ai_story",
                  "A scientist discovers a signal beneath a ruined city.",
              ),
              (
                  "expand_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
              (
                  "preserve_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
          ]

          for mode, story in cases:

              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert isinstance(
                  plan,
                  dict,
              )

              assert (
                  "scenes"
                  in plan
              )

              assert (
                  "shots"
                  in plan
              )

          print(
              "Planner smoke tests PASSED."
          )
          PY

      - name: Director contract tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.qwen_director import (
              QwenDirector,
          )

          director = QwenDirector(
              Path(".").resolve()
          )

          ai = (
              director._story_director_system(
                  "ai_story"
              )
          )

          expand = (
              director._story_director_system(
                  "expand_user_story"
              )

          preserve = (
              director._story_director_system(
                  "preserve_user_story"
              )

          shots = (
              director._shot_director_system()
          )

          assert "AI STORY MODE" in ai
          assert "EXPAND STORY MODE" in expand
          assert "PRESERVE STORY MODE" in preserve

          assert '"characters"' in ai
          assert '"scenes"' in ai

          assert '"shots"' not in ai

          assert "Create 4–6 meaningful scenes" in ai

          assert "2–4 distinct shots" in shots

          assert (
              "Do not create new characters"
              in shots
          )

          print(
              "Director contract tests PASSED."
          )
          PY

      - name: Director mode behavior tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.qwen_director import (
              QwenDirector,
          )

          director = QwenDirector(
              Path(".").resolve()
          )

          source = (
              "A lone man walks through an endless abyss "
              "at the edge of a collapsing world."
          )

          director._validate_mode_output(
              "ai_story",
              source,
              (
                  "A lone man enters the abyss and discovers "
                  "that the collapsing world is hiding a final "
                  "choice that will determine whether anything "
                  "survives."
              ),
          )

          director._validate_mode_output(
              "expand_user_story",
              source,
              (
                  "A lone man walks through an endless abyss "
                  "at the edge of a collapsing world. "
                  "He remembers the life he lost before the "
                  "collapse and realizes that his journey is "
                  "connected to the final fracture spreading "
                  "across the horizon."
              ),
          )

          director._validate_mode_output(
              "preserve_user_story",
              source,
              source,
          )

          try:

              director._validate_mode_output(
                  "preserve_user_story",
                  source,
                  source + " Extra.",
              )

          except RuntimeError:
              pass

          else:

              raise AssertionError(
                  "Preserve mode accepted modified story."
              )

          assert director._valid_character_name(
              "Maya"
          )

          assert director._valid_character_name(
              "man"
          )

          assert not director._valid_character_name(
              "Visual"
          )

          scene = {
              "scene_id": "scene_001",
              "title": "The Beginning",
              "location": "ruined city",
              "description": "A man walks through the ruined city.",
              "characters": ["Maya"],
          }

          fallback = (
              director._fallback_shots_for_scene(
                  scene,
                  1,
              )
          )

          assert len(
              fallback
          ) == 2

          shots = [
              dict(
                  fallback[0]
              ),
              dict(
                  fallback[1]
              ),
          ]

          director._normalize_ids(
              [
                  scene,
              ],
              shots,
          )

          assert (
              shots[0]["shot_id"]
              != shots[1]["shot_id"]
          )

          print(
              "Director mode behavior tests PASSED."
          )
          PY

      - name: Runtime import integration
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          modules = [
              "planner.production_planner",
              "planner.qwen_director",
              "pipeline.production_orchestrator",
              "pipeline.identity_anchor_store",
              "pipeline.h3_scene_continuity",
              "execution.h3_workflow_builder",
              "execution.h3_upscaled_workflow_builder",
              "execution.shot_executor",
              "execution.production_runner",
              "execution.h3_runtime",
              "execution.assembly_manager",
              "scheduler.gpu_scheduler",
              "ui.storyboard_gradio",
          ]

          for module in modules:
              __import__(module)

          print(
              "Runtime imports PASSED."
          )
          PY

      - name: Gradio draft contract
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from ui.storyboard_gradio import (
              ProductionController,
          )

          controller = (
              ProductionController()
          )

          assert (
              hasattr(
                  controller,
                  "_saved_drafts",
              )
          )

          assert (
              hasattr(
                  controller,
                  "preview_saved",
              )
          )

          assert (
              hasattr(
                  controller,
                  "preview_latest_for_mode",
              )
          )

          assert (
              hasattr(
                  controller,
                  "generate_storyboard",
              )
          )

          print(
              "Gradio draft contract PASSED."
          )
          PY

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
