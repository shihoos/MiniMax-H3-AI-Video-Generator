name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: H3 Repository Validation
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle

      - name: Project validator
        run: |
          python scripts/validate_project.py

      - name: Planner smoke test
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          root = Path(".").resolve()

          planner = ProductionPlanner(
              root
          )

          plan = planner.build(
              mode="preserve_user_story",
              user_input=(
                  "A cinematic city street at sunset. "
                  "The camera moves slowly across the rooftop "
                  "as wind moves through the scene."
              ),
              workflow_mode="ref2v",
              profile="base",
          )

          # A valid planner result must contain scenes and shots.
          # Character extraction is intentionally conservative and
          # must NOT be required for every story.
          assert plan["scenes"], (
              "Planner produced no scenes."
          )

          assert plan["shots"], (
              "Planner produced no shots."
          )

          assert plan["width"] == 1344
          assert plan["height"] == 768
          assert plan["fps"] == 24
          assert plan["steps"] == 20

          for shot in plan["shots"]:
              assert shot["width"] == 1344
              assert shot["height"] == 768
              assert shot["fps"] == 24
              assert shot["steps"] == 20

          print("Planner smoke test PASSED.")
          print(
              "Scenes:",
              len(plan["scenes"]),
          )
          print(
              "Shots:",
              len(plan["shots"]),
          )
          print(
              "Characters detected:",
              len(plan["characters"]),
          )
          print(
              "Normal Ref2V steps:",
              plan["steps"],
          )
          PY

      - name: Workflow inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          production = [
              Path(
                  "workflows/generation/"
                  "H3_Ref2V_Production.json"
              ),
              Path(
                  "workflows/generation/"
                  "H3_Turbo_Ref2V_Production.json"
              ),
              Path(
                  "workflows/postprocess/"
                  "H3_Ref2V_UltimateUpscale_Production.json"
              ),
          ]

          sources = [
              Path(
                  "workflows/sources/"
                  "H3_Turbo_Reference_Source.json"
              ),
              Path(
                  "workflows/sources/"
                  "H3_LatentUpscaler_Source.json"
              ),
          ]

          for path in production + sources:
              assert path.is_file(), path

              data = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              assert isinstance(
                  data,
                  dict,
              )

              assert data.get("nodes")

              assert isinstance(
                  data.get("links", []),
                  list,
              )

              print(
                  "PASS",
                  path,
                  "nodes=",
                  len(data["nodes"]),
                  "links=",
                  len(data.get("links", [])),
              )
          PY

      - name: Story mode smoke tests
        run: |
          python - <<'PY'
          from pathlib import Path
          from planner.production_planner import ProductionPlanner

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          stories = {
              "preserve_user_story": (
                  "A detective enters an abandoned railway station at midnight."
              ),
              "expand_user_story": (
                  "A detective enters an abandoned railway station."
              ),
              "ai_story": (
                  "A scientist discovers a strange signal beneath an abandoned city."
              ),
          }

          for mode, story in stories.items():
              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert plan["scenes"], mode
              assert plan["shots"], mode
              assert plan["width"] == 1344
              assert plan["height"] == 768
              assert plan["fps"] == 24
              assert plan["steps"] == 20

              print(
                  "PASS",
                  mode,
                  "scenes=",
                  len(plan["scenes"]),
                  "shots=",
                  len(plan["shots"]),
              )
          PY

      - name: Turbo contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path(
              "workflows/generation/"
              "H3_Turbo_Ref2V_Production.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          text = json.dumps(data)

          assert (
              "minimax_h3_turbo_v4_step600_ema.safetensors"
              in text
          )

          assert (
              "minimax_h3_ref2v_turbo_4step"
              not in text
          )

          print(
              "PASS Turbo Step600 / 8-step inventory"
          )
          PY

      - name: 720p delivery contract
        run: |
          python - <<'PY'
          from planner.config import (
              DELIVERY_WIDTH,
              DELIVERY_HEIGHT,
              DELIVERY_FPS,
              UPSCALE_WIDTH,
              UPSCALE_HEIGHT,
          )

          assert DELIVERY_WIDTH == 1280
          assert DELIVERY_HEIGHT == 720
          assert DELIVERY_FPS == 24

          assert UPSCALE_WIDTH == 1920
          assert UPSCALE_HEIGHT == 1080

          print("PASS 1920x1080 upscale -> 1280x720 delivery")
          PY
          
      - name: Runtime manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "configs/custom_nodes.yaml"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "Comfyui_Minimax_h3_latent_Upscaler",
              "Comfyui-MMH3-UltimateUpscale",
              "ComfyUI-MiniMax-H3-Turbo",
              "ComfyUI-Workflow-To-API-Converter",
              "ComfyUI-VideoHelperSuite",
          ]

          for name in required:
              assert name in text, name
              print(
                  "PASS",
                  name,
              )
          PY

      - name: Ultimate Upscale node contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "workflows/postprocess/"
              "H3_Ref2V_UltimateUpscale_Production.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          types = {
              node.get("type")
              for node in data.get(
                  "nodes",
                  []
              )
          }

          required = {
              "MinimaxH3LatentUpscaler3D",
              "MMH3LatentUpscaleWithModelParams",
              "MMH3TemporalSplitParams",
              "MMH3SpatialSplitParams",
              "MMH3UltimateUpscale",
          }

          missing = required - types

          assert not missing, missing

          print(
              "PASS Ultimate Upscale production contract"
          )
          PY

      - name: Repository cleanup
        run: |
          test ! -e workflows/generation/aa
          test ! -e workflows/sources/a
          ! find . -type f -name '*_TEST.json' | grep -q .

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
