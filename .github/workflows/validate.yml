name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: minimax-h3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:

  validate:

    name: H3 Production Validation

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML gradio==6.0.0

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            ui

      - name: Reference path wiring
        run: |
          python scripts/validate_reference_wiring.py

      - name: Project validator
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python scripts/validate_project.py

      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          tests = {
              "preserve_user_story":
                  "A detective enters an abandoned railway station at midnight.",

              "expand_user_story":
                  "A detective enters an abandoned railway station.",

              "ai_story":
                  "A scientist discovers a strange signal beneath an abandoned city.",
          }

          for mode, story in tests.items():

              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert plan["scenes"]
              assert plan["shots"]

              assert plan["width"] == 1344
              assert plan["height"] == 768
              assert plan["fps"] == 24
              assert plan["normal_steps"] == 20
              assert plan["turbo_steps"] == 8

          print(
              "Planner smoke tests PASSED."
          )
          PY

      - name: Story director regression tests
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.qwen_director import (
              QwenDirector,
          )

          director = QwenDirector(
              Path(".").resolve()
          )

          source = (
              "A lone man walks through an endless abyss "
              "at the edge of a collapsing world."
          )

          director._validate_mode_output(
              "preserve_user_story",
              source,
              source,
          )

          try:
              director._validate_mode_output(
                  "preserve_user_story",
                  source,
                  source + " Extra event.",
              )
          except RuntimeError:
              pass
          else:
              raise AssertionError(
                  "Preserve mode accepted changed story."
              )

          try:
              director._validate_mode_output(
                  "expand_user_story",
                  source,
                  source,
              )
          except RuntimeError:
              pass
          else:
              raise AssertionError(
                  "Expand mode accepted unchanged input."
              )

          expanded = (
              source
              + " The man crosses fractured ground "
              + "while distant mountains collapse into glowing dust. "
              + "A violent storm tears through the abyss "
              + "and forces him to continue toward the final horizon."
          )

          director._validate_mode_output(
              "expand_user_story",
              source,
              expanded,
          )

          try:
              director._validate_mode_output(
                  "ai_story",
                  source,
                  source,
              )
          except RuntimeError:
              pass
          else:
              raise AssertionError(
                  "AI Story mode accepted unchanged input."
              )

          assert director._valid_character_name(
              "man"
          )

          assert director._valid_character_name(
              "Maya"
          )

          assert not director._valid_character_name(
              "Treat"
          )

          assert not director._valid_character_name(
              "Visual"
          )

          sanitized = (
              director._sanitize_characters(
                  [
                      {
                          "name": "man",
                          "role": "protagonist",
                      },
                      {
                          "name": "Treat",
                          "role": "invalid",
                      },
                      {
                          "name": "Maya",
                          "role": "protagonist",
                      },
                  ]
              )
          )

          names = {
              item["name"].lower()
              for item in sanitized
          }

          assert names == {
              "man",
              "maya",
          }

          print(
              "Story director regression tests PASSED."
          )
          PY

      - name: Qwen director contract
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.qwen_director import (
              QwenDirector,
          )

          director = QwenDirector(
              Path(".").resolve()
          )

          ai = (
              director._story_director_system(
                  "ai_story"
              )
          )

          expand = (
              director._story_director_system(
                  "expand_user_story"
              )
          )

          preserve = (
              director._story_director_system(
                  "preserve_user_story"
              )
          )

          shots = (
              director._shot_director_system()
          )

          assert '"characters"' in ai
          assert '"scenes"' in ai
          assert '"shots"' not in ai
          assert "genuinely developed story" in ai

          assert (
              "Preserve every important fact"
              in expand
          )

          assert (
              "Do not simply copy the user's paragraphs"
              in expand
          )

          assert (
              "immutable source material"
              in preserve
          )

          assert (
              "must equal the supplied story"
              in preserve
          )

          assert '"shots"' in shots

          assert (
              "Do NOT create new characters"
              in shots
          )

          assert (
              "Only use names present in the character bible"
              in shots
          )

          print(
              "Qwen director contract PASSED."
          )
          PY

      - name: Runtime import integration
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          modules = [
              "planner.production_planner",
              "planner.qwen_director",
              "pipeline.production_orchestrator",
              "pipeline.identity_anchor_store",
              "pipeline.h3_scene_continuity",
              "execution.h3_workflow_builder",
              "execution.h3_upscaled_workflow_builder",
              "execution.shot_executor",
              "execution.production_runner",
              "execution.h3_runtime",
              "execution.assembly_manager",
              "scheduler.gpu_scheduler",
              "ui.storyboard_gradio",
          ]

          for module in modules:
              __import__(module)

          print(
              "Production runtime imports PASSED."
          )
          PY

      - name: Director configuration
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from planner.config import (
              DIRECTOR_MODEL_FILENAME,
              DELIVERY_HEIGHT,
              DELIVERY_WIDTH,
              UPSCALE_HEIGHT,
              UPSCALE_WIDTH,
          )

          assert (
              DIRECTOR_MODEL_FILENAME
              == "Qwen3-14B-Q4_K_M.gguf"
          )

          assert (
              DELIVERY_WIDTH,
              DELIVERY_HEIGHT,
          ) == (
              1280,
              720,
          )

          assert (
              UPSCALE_WIDTH,
              UPSCALE_HEIGHT,
          ) == (
              1920,
              1088,
          )

          print(
              "Director configuration PASSED."
          )
          PY

      - name: Assembly contract
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "execution/assembly_manager.py"
          ).read_text(
              encoding="utf-8"
          )

          assert (
              '"-vf",\n'
              '            "-vf"'
              not in text
          )

          assert (
              '"-c:v",\n'
              '            "libx264"'
              in text
          )

          assert (
              '"-c:a",\n'
              '            "aac"'
              in text
          )

          print(
              "Assembly contract PASSED."
          )
          PY

      - name: Gradio UI contract
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              "ui/storyboard_gradio.py"
          )

          assert path.is_file()

          text = path.read_text(
              encoding="utf-8"
          )

          for token in [
              "ProductionController",
              "Your Story",
              "AI Story",
              "Expand Story",
              "Preserve Story",
              "Generate Storyboard",
              "Approve & Generate Video",
              "H3Runtime",
              "ProductionRunner",
              "check_worker",
              "share=True",
          ]:
              assert token in text, token

          print(
              "Gradio UI PASSED."
          )
          PY

      - name: Combined upscale contract
        env:
          H3_DIRECTOR_ENABLED: "0"
        run: |
          python - <<'PY'
          from execution.h3_upscaled_workflow_builder import (
              H3UpscaledWorkflowBuilder,
          )

          assert hasattr(
              H3UpscaledWorkflowBuilder,
              "build_upscaled",
          )

          print(
              "Combined H3 upscale builder PASSED."
          )
          PY

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
