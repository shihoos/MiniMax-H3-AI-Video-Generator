name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read


jobs:

  validate:

    name: H3 Repository Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.11"


      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyYAML


      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle


      - name: Project validator
        run: |
          python scripts/validate_project.py


      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"

        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          root = Path(
              "."
          ).resolve()

          planner = ProductionPlanner(
              root
          )

          stories = {
              "preserve_user_story": (
                  "A detective enters an abandoned "
                  "railway station at midnight."
              ),
              "expand_user_story": (
                  "A detective enters an abandoned "
                  "railway station."
              ),
              "ai_story": (
                  "A scientist discovers a strange "
                  "signal beneath an abandoned city."
              ),
          }

          for mode, story in stories.items():

              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert plan[
                  "scenes"
              ], mode

              assert plan[
                  "shots"
              ], mode

              assert plan[
                  "width"
              ] == 1344

              assert plan[
                  "height"
              ] == 768

              assert plan[
                  "fps"
              ] == 24

              assert plan[
                  "normal_steps"
              ] == 20

              assert plan[
                  "turbo_steps"
              ] == 8

              for shot in plan[
                  "shots"
              ]:

                  assert shot[
                      "width"
                  ] == 1344

                  assert shot[
                      "height"
                  ] == 768

                  assert shot[
                      "fps"
                  ] == 24

                  assert shot[
                      "frames_per_shot"
                  ] == 124

                  assert shot[
                      "steps"
                  ] == 20

          print(
              "Planner smoke tests PASSED."
          )
          PY


      - name: Director configuration contract
        env:
          H3_DIRECTOR_ENABLED: "0"

        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.config import (
              DIRECTOR_MODEL_FILENAME,
              DELIVERY_FPS,
              DELIVERY_HEIGHT,
              DELIVERY_WIDTH,
              UPSCALE_HEIGHT,
              UPSCALE_WIDTH,
              director_enabled,
          )

          from planner.qwen_director import (
              QwenDirector,
          )

          assert (
              DIRECTOR_MODEL_FILENAME
              == "Qwen3-14B-Q4_K_M.gguf"
          )

          assert DELIVERY_WIDTH == 1280
          assert DELIVERY_HEIGHT == 720
          assert DELIVERY_FPS == 24

          assert UPSCALE_WIDTH == 1920
          assert UPSCALE_HEIGHT == 1080

          assert (
              director_enabled()
              is False
          )

          director = QwenDirector(
              Path(".").resolve()
          )

          assert (
              director.available
              is False
          )

          director.unload()

          print(
              "Director configuration contract PASSED."
          )
          PY


      - name: Story mode smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"

        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          stories = {
              "preserve_user_story": (
                  "A detective enters an abandoned "
                  "railway station at midnight."
              ),
              "expand_user_story": (
                  "A detective enters an abandoned "
                  "railway station."
              ),
              "ai_story": (
                  "A scientist discovers a strange "
                  "signal beneath an abandoned city."
              ),
          }

          for mode, story in stories.items():

              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2v",
                  profile="base",
              )

              assert plan["scenes"]
              assert plan["shots"]

              assert (
                  plan["width"]
                  == 1344
              )

              assert (
                  plan["height"]
                  == 768
              )

              assert (
                  plan["fps"]
                  == 24
              )

              assert (
                  plan["normal_steps"]
                  == 20
              )

              assert (
                  plan["turbo_steps"]
                  == 8
              )

              print(
                  "PASS",
                  mode,
                  "scenes=",
                  len(plan["scenes"]),
                  "shots=",
                  len(plan["shots"]),
              )
          PY


      - name: Workflow inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          production = [
              Path(
                  "workflows/generation/"
                  "H3_Ref2V_Production.json"
              ),
              Path(
                  "workflows/generation/"
                  "H3_Turbo_Ref2V_Production.json"
              ),
              Path(
                  "workflows/postprocess/"
                  "H3_Ref2V_UltimateUpscale_Production.json"
              ),
          ]

          sources = [
              Path(
                  "workflows/sources/"
                  "H3_Turbo_Reference_Source.json"
              ),
              Path(
                  "workflows/sources/"
                  "H3_LatentUpscaler_Source.json"
              ),
          ]

          for path in (
              production
              + sources
          ):

              assert path.is_file(), path

              data = json.loads(
                  path.read_text(
                      encoding="utf-8"
                  )
              )

              assert isinstance(
                  data,
                  dict,
              )

              assert data.get(
                  "nodes"
              )

              assert isinstance(
                  data.get(
                      "links",
                      [],
                  ),
                  list,
              )

              print(
                  "PASS",
                  path,
                  "nodes=",
                  len(
                      data[
                          "nodes"
                      ]
                  ),
                  "links=",
                  len(
                      data.get(
                          "links",
                          [],
                      )
                  ),
              )
          PY


      - name: Ref2V executable contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "workflows/generation/"
              "H3_Ref2V_Production.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          types = {
              node.get("type")
              for node in data[
                  "nodes"
              ]
          }

          required = {
              "UNETLoader",
              "CLIPLoader",
              "MiniMaxH3ReferenceToVideo",
              "SamplerCustomAdvanced",
              "VAEDecode",
              "VAEDecodeAudio",
              "CreateVideo",
              "SaveVideo",
          }

          assert not (
              required - types
          )

          print(
              "PASS Ref2V executable contract"
          )
          PY


      - name: Turbo 8-step contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "workflows/generation/"
              "H3_Turbo_Ref2V_Production.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          text = json.dumps(
              data
          )

          assert (
              "minimax_h3_turbo_v4_step600_ema.safetensors"
              in text
          )

          assert (
              "minimax_h3_ref2v_turbo_4step"
              not in text
          )

          print(
              "PASS Turbo Step600 / 8-step inventory"
          )
          PY


      - name: Ultimate Upscale contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "workflows/postprocess/"
              "H3_Ref2V_UltimateUpscale_Production.json"
          )

          data = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          types = {
              node.get("type")
              for node in data.get(
                  "nodes",
                  [],
              )
          }

          required = {
              "MinimaxH3LatentUpscaler3D",
              "MMH3LatentUpscaleWithModelParams",
              "MMH3TemporalSplitParams",
              "MMH3SpatialSplitParams",
              "MMH3UltimateUpscale",
              "VAEDecode",
              "VAEDecodeAudio",
              "CreateVideo",
              "SaveVideo",
          }

          missing = (
              required
              - types
          )

          assert not missing, missing

          text = json.dumps(
              data
          )

          assert (
              "minimax_h3_latent_upscaler_3d_fp16.safetensors"
              in text
          )

          print(
              "PASS Ultimate Upscale production contract"
          )
          PY


      - name: Delivery contract
        run: |
          python - <<'PY'
          from planner.config import (
              DELIVERY_FPS,
              DELIVERY_HEIGHT,
              DELIVERY_WIDTH,
              UPSCALE_HEIGHT,
              UPSCALE_WIDTH,
          )

          assert DELIVERY_WIDTH == 1280
          assert DELIVERY_HEIGHT == 720
          assert DELIVERY_FPS == 24

          assert UPSCALE_WIDTH == 1920
          assert UPSCALE_HEIGHT == 1080

          print(
              "PASS 1920x1080 upscale -> 1280x720 delivery"
          )
          PY


      - name: Runtime manifest
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "configs/custom_nodes.yaml"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "Comfyui_Minimax_h3_latent_Upscaler",
              "Comfyui-MMH3-UltimateUpscale",
              "ComfyUI-MiniMax-H3-Turbo",
              "ComfyUI-Workflow-To-API-Converter",
              "ComfyUI-VideoHelperSuite",
          ]

          for name in required:

              assert (
                  name in text
              ), name

              print(
                  "PASS",
                  name,
              )
          PY


      - name: Repository artifact cleanup
        run: |
          test ! -e workflows/generation/aa
          test ! -e workflows/sources/a

          if find . \
            -type f \
            -name '*_TEST.json' \
            -print \
            -quit | grep -q .; then
              echo "Temporary TEST workflow found."
              exit 1
          fi


      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
