name: Validate MiniMax H3 Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimax-h3-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: H3 Production Validation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify installed dependency consistency
        run: |
          python -m pip check

      - name: Verify required dependencies
        run: |
          python - <<'PY'
          import importlib

          required_modules = [
              "yaml",
              "gradio",
              "PIL",
              "websocket",
          ]

          for module in required_modules:
              importlib.import_module(module)

          print("Required dependencies PASSED.")
          PY

      - name: Python syntax
        run: |
          python -m compileall -q \
            execution \
            pipeline \
            planner \
            scheduler \
            schemas \
            scripts \
            kaggle \
            ui

      - name: Reference path wiring
        run: |
          python scripts/validate_reference_wiring.py

      - name: Project validator
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_project.py

      - name: H3 semantic workflow topology
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path(".")

          def load(path):
              return json.loads(
                  (ROOT / path).read_text(encoding="utf-8")
              )

          def nodes_by_type(graph, node_type):
              return [
                  node
                  for node in graph.get("nodes", [])
                  if node.get("type") == node_type
              ]

          def outgoing_model_targets(graph, source_id):
              nodes = {
                  int(node["id"]): node
                  for node in graph.get("nodes", [])
              }
              targets = []
              for link in graph.get("links", []):
                  if (
                      isinstance(link, list)
                      and len(link) >= 6
                      and int(link[1]) == int(source_id)
                      and str(link[5]).upper() == "MODEL"
                  ):
                      target = nodes.get(int(link[3]))
                      if target is not None:
                          targets.append(target)
              return targets

          turbo = load(
              "workflows/generation/H3_Turbo_Ref2VA_Production.json"
          )
          turbo_lora = nodes_by_type(
              turbo,
              "MiniMaxH3TurboLoRA",
          )
          turbo_opt = nodes_by_type(
              turbo,
              "H3MemoryOptimization",
          )

          assert len(turbo_lora) == 1
          assert len(turbo_opt) == 1

          turbo_lora_targets = outgoing_model_targets(
              turbo,
              turbo_lora[0]["id"],
          )
          assert any(
              node.get("type") == "H3MemoryOptimization"
              for node in turbo_lora_targets
          ), "TurboLoRA must feed H3MemoryOptimization."

          turbo_opt_targets = outgoing_model_targets(
              turbo,
              turbo_opt[0]["id"],
          )
          turbo_target_types = {
              node.get("type")
              for node in turbo_opt_targets
          }
          assert "BasicScheduler" in turbo_target_types
          assert "BasicGuider" in turbo_target_types

          upscale = load(
              "workflows/postprocess/H3_Ref2VA_UltimateUpscale_Production.json"
          )
          upscale_opt = nodes_by_type(
              upscale,
              "H3MemoryOptimization",
          )
          assert len(upscale_opt) == 1

          upscale_targets = outgoing_model_targets(
              upscale,
              upscale_opt[0]["id"],
          )
          upscale_target_types = {
              node.get("type")
              for node in upscale_targets
          }
          assert "BasicScheduler" in upscale_target_types
          assert "BasicGuider" in upscale_target_types
          assert "MMH3UltimateUpscale" in upscale_target_types

          print("H3 semantic workflow topology PASSED.")
          PY

      - name: Runtime install contract
        run: |
          python scripts/validate_runtime_contract.py

      - name: Director validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_director.py

      - name: Production continuity validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          test -f scripts/validate_production_continuity.py
          python scripts/validate_production_continuity.py

      - name: Production scale validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_production_scale.py

      - name: Enhancement validation
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python scripts/validate_enhancements.py

      - name: Planner smoke tests
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          from planner.production_planner import (
              ProductionPlanner,
          )

          planner = ProductionPlanner(
              Path(".").resolve()
          )

          cases = [
              (
                  "ai_story",
                  "A scientist discovers a strange signal beneath a ruined city.",
              ),
              (
                  "expand_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
              (
                  "preserve_user_story",
                  "A lone man walks through an endless abyss at the edge of a collapsing world.",
              ),
          ]

          for mode, story in cases:
              plan = planner.build(
                  mode=mode,
                  user_input=story,
                  workflow_mode="ref2va",
                  profile="base",
              )

              assert isinstance(plan, dict)
              assert "scenes" in plan
              assert "shots" in plan

          print("Planner smoke tests PASSED.")
          PY

      - name: Runtime import integration
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          modules = [
              "planner.production_planner",
              "planner.qwen_director",
              "pipeline.production_orchestrator",
              "pipeline.identity_anchor_store",
              "pipeline.h3_scene_continuity",
              "pipeline.dialogue_duration",
              "pipeline.dialogue_timeline",
              "pipeline.continuity_ledger",
              "pipeline.storyboard_reference_builder",
              "execution.h3_workflow_builder",
              "execution.h3_upscaled_workflow_builder",
              "execution.shot_executor",
              "execution.production_runner",
              "execution.h3_runtime",
              "execution.assembly_manager",
              "scheduler.gpu_scheduler",
              "schemas.dialogue",
              "schemas.shot",
              "schemas.character",
              "pipeline.timeline",
              "pipeline.vlm_analyzer",
              "pipeline.visual_feedback",
              "pipeline.quality_gate",
              "pipeline.retake_manager",
              "pipeline.runtime_diagnostics",
              "pipeline.context_ir",
              "pipeline.production_manifest",
              "ui.storyboard_gradio",
          ]

          for module in modules:
              __import__(module)

          print("Runtime imports PASSED.")
          PY

      - name: SQLite heartbeat threading regression
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          import tempfile
          import threading
          from pathlib import Path

          from pipeline.job_queue import ProductionJobQueue

          with tempfile.TemporaryDirectory(prefix="h3-jobqueue-") as td:
              root = Path(td)
              plan_path = root / "plan.json"
              plan_path.write_text("{}", encoding="utf-8")

              queue = ProductionJobQueue(
                  root / "jobs.sqlite3"
              )

              job_id = queue.submit(
                  production_id="validator-production",
                  plan_path=plan_path,
              )

              claimed = queue.claim_next()
              assert claimed is not None
              assert claimed["job_id"] == job_id

              worker_token = str(
                  claimed["worker_token"]
              )

              errors = []

              def heartbeat():
                  try:
                      assert queue.heartbeat(
                          job_id,
                          worker_token,
                      )
                  except Exception as exc:
                      errors.append(exc)

              thread = threading.Thread(
                  target=heartbeat,
                  name="validator-heartbeat",
              )
              thread.start()
              thread.join(timeout=10)

              assert not thread.is_alive()
              assert not errors, errors

          print(
              "SQLite heartbeat threading regression PASSED."
          )
          PY

      - name: Continuity architecture contract
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          orchestrator = Path(
              "pipeline/production_orchestrator.py"
          ).read_text(
              encoding="utf-8"
          )

          runner = Path(
              "execution/production_runner.py"
          ).read_text(
              encoding="utf-8"
          )

          shot = Path(
              "schemas/shot.py"
          ).read_text(
              encoding="utf-8"
          )

          gradio = Path(
              "ui/storyboard_gradio.py"
          ).read_text(
              encoding="utf-8"
          )

          queue = Path(
              "pipeline/job_queue.py"
          ).read_text(
              encoding="utf-8"
          )

          validate = Path(
              "scripts/validate_project.py"
          ).read_text(
              encoding="utf-8"
          )

          # Production enforcement must remain deterministic after Qwen unload.
          enforce_start = orchestrator.find(
              "def _enforce_production_contracts"
          )

          assert enforce_start >= 0

          enforce_tail = orchestrator[
              enforce_start:
          ]

          enforce_end = enforce_tail.find(
              "    def create_production_plan"
          )

          enforce_body = (
              enforce_tail[:enforce_end]
              if enforce_end >= 0
              else enforce_tail
          )

          assert (
              "repair_continuity_violation"
              not in enforce_body
          )

          assert (
              "apply_field_level_fallback"
              in enforce_body
          )

          # Runner must serialize manifest writes.
          assert "_manifest_lock" in runner
          assert "with self._manifest_lock" in runner

          # Shot contract must carry structured continuity state and dialogue.
          assert "continuity_start_state" in shot
          assert "continuity_end_state" in shot
          assert "dialogue_events" in shot

          # Project validator must require the new dialogue schema.
          assert '"schemas/dialogue.py"' in validate

          # Queue heartbeat must use per-operation SQLite connections rather
          # than sharing a connection across threads.
          assert "def _connect(self):" in queue
          assert "sqlite3.connect(" in queue
          assert "check_same_thread=False" not in queue

          # Background production execution must wait for controller lock
          # contention instead of converting normal contention into a job
          # failure. Require a bounded timeout and a guarded release.
          assert "def _execute_approved_plan" in gradio
          execute_body = gradio[
              gradio.find("def _execute_approved_plan"):
          ]
          assert "blocking=False" not in execute_body[
              : execute_body.find("def ", 1)
              if execute_body.find("def ", 1) >= 0
              else len(execute_body)
          ]
          assert "timeout=" in execute_body
          assert "lock_acquired" in execute_body
          assert "if lock_acquired:" in execute_body

          # Live preview must be opt-in, not a permanent 3-second idle poll.
          assert (
              "gr.Timer(value=3.0, active=False)" in gradio
              or
              "gr.Timer(value=3.0, active = False)" in gradio
          )
          assert "refresh_live_preview.click" in gradio
          assert "gr.update(active=True)" in gradio

          # Continuity state must reach H3 as prose, not raw JSON.
          assert "_state_summary(" in shot
          assert 'json.dumps(self.continuity_start_state' not in shot
          assert 'json.dumps(\n                self.continuity_start_state' not in shot

          print(
              "Continuity architecture contract PASSED."
          )
          PY

      - name: Gradio UI contract
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
        run: |
          python - <<'PY'
          from pathlib import Path

          text = Path(
              "ui/storyboard_gradio.py"
          ).read_text(
              encoding="utf-8"
          )

          required = [
              "ProductionController",
              "generate_storyboard",
              "preview_saved",
              "preview_latest_for_mode",
              "_saved_drafts",
              "Approve & Generate Video",
          ]

          for token in required:
              assert token in text, token

          assert (
              "Qwen director returned no usable characters"
              not in text
          )

          # The UI must respect a CI-supplied director-disabled environment.
          assert (
              'os.environ.setdefault("H3_DIRECTOR_ENABLED", "1")'
              in text
              or
              "os.environ.setdefault('H3_DIRECTOR_ENABLED', '1')"
              in text
          )

          print(
              "Gradio UI contract PASSED."
          )
          PY

      - name: Direct Gradio entry-point smoke
        env:
          H3_DIRECTOR_ENABLED: "0"
          H3_GRADIO_SHARE: "0"
          GRADIO_ANALYTICS_ENABLED: "False"
        shell: bash
        run: |
          set -u

          rm -f /tmp/h3_gradio_entry.log

          python -u ui/storyboard_gradio.py \
            > /tmp/h3_gradio_entry.log 2>&1 &

          pid=$!

          cleanup() {
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
          }

          trap cleanup EXIT

          ready=0

          for _ in $(seq 1 30); do
            if curl -fsS \
              --max-time 2 \
              http://127.0.0.1:8765/ \
              >/dev/null 2>&1; then
              ready=1
              break
            fi

            if ! kill -0 "$pid" 2>/dev/null; then
              break
            fi

            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "Direct Gradio entry-point smoke FAILED."
            echo "--- Gradio entry-point log ---"
            cat /tmp/h3_gradio_entry.log || true
            echo "--- end log ---"
            exit 1
          fi

          echo "Direct Gradio entry-point smoke PASSED."

      - name: Complete
        run: |
          echo "MiniMax H3 CI validation PASSED."
