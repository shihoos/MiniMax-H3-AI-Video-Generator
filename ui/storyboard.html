<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
/>

<title>MiniMax H3 Storyboard</title>

<style>
:root {
  --bg: #0b0f14;
  --panel: #121821;
  --panel-2: #171f29;
  --border: #273241;
  --text: #e7edf5;
  --muted: #92a0b0;
  --accent: #7dd3fc;
  --good: #86efac;
  --warning: #fde68a;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 16px 22px;
  background: rgba(11, 15, 20, 0.96);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}

.topbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 16px;
}

.title {
  font-size: 22px;
  font-weight: 800;
}

.subtitle {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

button {
  border: 1px solid var(--border);
  border-radius: 9px;
  padding: 9px 13px;
  background: var(--panel-2);
  color: var(--text);
  cursor: pointer;
  font-weight: 700;
}

button:hover {
  border-color: #4b6177;
}

button.primary {
  background: #163349;
  border-color: #2e6d92;
}

button.approve {
  background: #12351f;
  border-color: #39734f;
  color: var(--good);
}

.status {
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
  font-size: 13px;
}

.status.approved {
  border-color: #39734f;
  color: var(--good);
}

.layout {
  display: grid;
  grid-template-columns: 320px minmax(0, 1fr);
  min-height: calc(100vh - 100px);
}

aside {
  padding: 18px;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  position: sticky;
  top: 100px;
  height: calc(100vh - 100px);
}

main {
  padding: 22px;
  overflow-y: auto;
}

.section {
  margin-bottom: 22px;
}

.section h2 {
  margin: 0 0 10px;
  font-size: 14px;
  color: var(--accent);
}

.story {
  width: 100%;
  min-height: 150px;
  padding: 12px;
  resize: vertical;

  background: #0d141d;
  color: var(--text);

  border: 1px solid var(--border);
  border-radius: 10px;

  line-height: 1.5;
}

.meta {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.meta-box {
  padding: 10px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.meta-box strong {
  display: block;
  font-size: 18px;
}

.meta-box span {
  color: var(--muted);
  font-size: 11px;
}

.card {
  margin-bottom: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.card-body {
  padding: 14px;
}

.character-name {
  font-weight: 800;
}

.character-role {
  margin-top: 3px;
  color: var(--muted);
  font-size: 12px;
}

.character-description {
  margin-top: 7px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.character-anchor {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  margin-top: 9px;
  border-radius: 8px;
  background: #070a0e;
}

.scene-title {
  font-weight: 800;
}

.scene-detail {
  margin-top: 6px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.45;
}

.timeline {
  overflow-x: auto;
}

.timeline-row {
  display: flex;
  gap: 10px;
  min-width: max-content;
}

.timeline-item {
  width: 175px;
  padding: 12px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 10px;
}

.timeline-item strong {
  color: var(--accent);
}

.timeline-item div {
  margin-top: 5px;
  color: var(--muted);
  font-size: 11px;
}

.shot-card {
  margin-bottom: 18px;
  background: linear-gradient(
    180deg,
    #111923,
    #0e151d
  );
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.shot-header {
  display: flex;
  justify-content: space-between;
  gap: 10px;

  padding: 13px 16px;

  border-bottom: 1px solid var(--border);
}

.shot-number {
  color: var(--accent);
  font-weight: 850;
}

.shot-meta {
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.shot-grid {
  display: grid;
  grid-template-columns: minmax(220px, 320px) minmax(0, 1fr);
}

.references {
  padding: 14px;
  border-right: 1px solid var(--border);
}

.references-label {
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 11px;
}

.refs-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.ref {
  overflow: hidden;
  background: #080c11;
  border: 1px solid var(--border);
  border-radius: 8px;
}

.ref img {
  display: block;
  width: 100%;
  height: 110px;
  object-fit: cover;
}

.ref span {
  display: block;
  padding: 6px;
  color: var(--muted);
  font-size: 10px;
}

.fields {
  display: grid;
  gap: 10px;
  padding: 14px;
}

.field-label {
  display: block;
  margin-bottom: 5px;
  color: var(--muted);
  font-size: 11px;
}

input,
textarea {
  width: 100%;
  padding: 9px 10px;

  background: #0b1118;
  color: var(--text);

  border: 1px solid var(--border);
  border-radius: 8px;

  outline: none;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

input:focus,
textarea:focus {
  border-color: #4d6c84;
}

.notice {
  color: var(--warning);
  font-size: 12px;
  line-height: 1.4;
}

@media (max-width: 900px) {
  .layout {
    grid-template-columns: 1fr;
  }

  aside {
    position: static;
    height: auto;
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }

  .shot-grid {
    grid-template-columns: 1fr;
  }

  .references {
    border-right: 0;
    border-bottom: 1px solid var(--border);
  }
}
</style>
</head>

<body>

<header>

  <div class="topbar">

    <div>
      <div class="title">
        MiniMax H3 Storyboard
      </div>

      <div class="subtitle">
        Qwen director → story → characters → scenes → shots → H3
      </div>
    </div>

    <div class="actions">

      <button
        onclick="reloadPlan()"
      >
        Reload
      </button>

      <button
        class="primary"
        onclick="saveDraft()"
      >
        Save Draft
      </button>

      <button
        class="approve"
        onclick="approvePlan()"
      >
        Approve Storyboard
      </button>

    </div>

  </div>

  <div
    id="status"
    class="status"
  >
    Loading storyboard...
  </div>

</header>

<div class="layout">

  <aside>

    <section class="section">

      <h2>
        Production
      </h2>

      <div class="meta">

        <div class="meta-box">
          <strong id="mode">
            —
          </strong>

          <span>
            Story mode
          </span>
        </div>

        <div class="meta-box">
          <strong id="profile">
            —
          </strong>

          <span>
            Generation
          </span>
        </div>

        <div class="meta-box">
          <strong id="characterCount">
            0
          </strong>

          <span>
            Characters
          </span>
        </div>

        <div class="meta-box">
          <strong id="shotCount">
            0
          </strong>

          <span>
            Shots
          </span>
        </div>

      </div>

    </section>

    <section class="section">

      <h2>
        Story
      </h2>

      <textarea
        id="story"
        class="story"
        placeholder="Story..."
      ></textarea>

    </section>

    <section class="section">

      <h2>
        Characters
      </h2>

      <div id="characters"></div>

    </section>

    <section class="section">

      <h2>
        Scenes
      </h2>

      <div id="scenes"></div>

    </section>

  </aside>

  <main>

    <section class="section">

      <h2>
        Shot Timeline
      </h2>

      <div class="timeline">

        <div
          id="timeline"
          class="timeline-row"
        ></div>

      </div>

    </section>

    <section class="section">

      <h2>
        Detailed Storyboard
      </h2>

      <div id="shots"></div>

    </section>

  </main>

</div>

<script>

let plan = null;


function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );
}


function mediaUrl(path) {

  return (
    "/media?path="
    + encodeURIComponent(
      path
    )
  );
}


async function reloadPlan() {

  const response = await fetch(
    "/api/plan",
    {
      cache: "no-store"
    }
  );

  if (!response.ok) {

    throw new Error(
      "Unable to load storyboard."
    );
  }

  plan = await response.json();

  render();
}


function renderStatus() {

  const status =
    document.getElementById(
      "status"
    );

  const approval =
    plan.approval?.status
    || "draft";

  if (
    approval === "approved"
  ) {

    status.className =
      "status approved";

    status.textContent =
      "APPROVED — this storyboard is ready for generation.";

  } else {

    status.className =
      "status";

    status.textContent =
      "DRAFT — review and edit before generation.";

  }
}


function renderMeta() {

  document.getElementById(
    "mode"
  ).textContent =
    plan.story_mode || "—";

  document.getElementById(
    "profile"
  ).textContent =
    plan.profile || "base";

  document.getElementById(
    "characterCount"
  ).textContent =
    (
      plan.characters || []
    ).length;

  document.getElementById(
    "shotCount"
  ).textContent =
    (
      plan.shots || []
    ).length;

  document.getElementById(
    "story"
  ).value =
    plan.story || "";
}


function renderCharacters() {

  const root =
    document.getElementById(
      "characters"
    );

  root.innerHTML = "";

  for (
    const character
    of (
      plan.characters || []
    )
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "character card";

    const paths = [
      ...(
        character.reference_paths
        || []
      )
    ];

    let image = "";

    if (
      paths.length
    ) {

      image =
        `
        <img
          class="character-anchor"
          src="${mediaUrl(paths[0])}"
          alt="Character reference"
        >
        `;

    }

    card.innerHTML = `
      <div class="card-body">

        <div class="character-name">
          ${escapeHtml(character.name)}
        </div>

        <div class="character-role">
          ${escapeHtml(character.role)}
        </div>

        <div class="character-description">
          ${escapeHtml(character.description)}
        </div>

        ${image}

      </div>
    `;

    root.appendChild(
      card
    );
  }
}


function renderScenes() {

  const root =
    document.getElementById(
      "scenes"
    );

  root.innerHTML = "";

  for (
    const scene
    of (
      plan.scenes || []
    )
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "scene-card card";

    card.innerHTML = `
      <div class="card-body">

        <div class="scene-title">
          ${escapeHtml(scene.scene_id)}
          —
          ${escapeHtml(scene.location)}
        </div>

        <div class="scene-detail">
          ${escapeHtml(scene.time_of_day)}
          ·
          ${escapeHtml(scene.weather)}
          ·
          ${escapeHtml(scene.mood)}
        </div>

        <div class="scene-detail">
          ${escapeHtml(scene.description)}
        </div>

      </div>
    `;

    root.appendChild(
      card
    );
  }
}


function renderTimeline() {

  const root =
    document.getElementById(
      "timeline"
    );

  root.innerHTML = "";

  for (
    const shot
    of (
      plan.shots || []
    )
  ) {

    const card =
      document.createElement(
        "div"
      );

    card.className =
      "timeline-item";

    card.innerHTML = `
      <strong>
        ${escapeHtml(shot.shot_id)}
      </strong>

      <div>
        ${escapeHtml(shot.duration_seconds)}
        sec
      </div>

      <div>
        ${escapeHtml(shot.camera_shot)}
      </div>
    `;

    root.appendChild(
      card
    );
  }
}


function renderShots() {

  const root =
    document.getElementById(
      "shots"
    );

  root.innerHTML = "";

  (
    plan.shots || []
  ).forEach(
    (
      shot,
      index
    ) => {

      const card =
        document.createElement(
          "article"
        );

      card.className =
        "shot-card";

      const refs = [];

      for (
        const path
        of (
          shot.reference_images
          || []
        )
      ) {

        refs.push(
          `
          <div class="ref">

            <img
              src="${mediaUrl(path)}"
              alt="Reference"
            >

            <span>
              Reference
            </span>

          </div>
          `
        );
      }

      const referenceHtml =
        refs.join("")
        ||
        `
        <div class="notice">
          No visual reference supplied.
          H3 will generate from the
          story and character conditioning.
        </div>
        `;

      card.innerHTML = `
        <div class="shot-header">

          <div>

            <div class="shot-number">
              ${escapeHtml(shot.shot_id)}
            </div>

            <div class="shot-meta">
              Scene ${escapeHtml(shot.scene_id)}
              ·
              ${escapeHtml(shot.duration_seconds)}
              sec
            </div>

          </div>

        </div>

        <div class="shot-grid">

          <div class="references">

            <div class="references-label">
              Reference images / identity anchors
            </div>

            <div class="refs-grid">
              ${referenceHtml}
            </div>

            ${
              (
                shot.reference_videos
                || []
              ).length
              ?
              `
              <div
                style="margin-top:10px"
              >
                <div class="references-label">
                  Reference videos
                </div>

                <div>
                  ${
                    shot.reference_videos.length
                  }
                  video(s)
                </div>
              </div>
              `
              :
              ""
            }

            ${
              (
                shot.reference_audio_paths
                || []
              ).length
              ?
              `
              <div
                style="margin-top:10px"
              >
                <div class="references-label">
                  Reference audio
                </div>

                <div>
                  ${
                    shot.reference_audio_paths.length
                  }
                  clip(s)
                </div>
              </div>
              `
              :
              `
              <div
                class="notice"
                style="margin-top:10px"
              >
                No audio reference supplied.
                Native H3 audio will be used.
              </div>
              `
            }

          </div>

          <div class="fields">

            <div>

              <label class="field-label">
                Characters
              </label>

              <input
                data-index="${index}"
                data-field="characters"
                value="${escapeHtml(
                  (
                    shot.characters
                    || []
                  ).join(", ")
                )}"
              >

            </div>

            <div>

              <label class="field-label">
                Camera shot
              </label>

              <input
                data-index="${index}"
                data-field="camera_shot"
                value="${escapeHtml(
                  shot.camera_shot
                )}"
              >

            </div>

            <div>

              <label class="field-label">
                Camera movement
              </label>

              <input
                data-index="${index}"
                data-field="camera_movement"
                value="${escapeHtml(
                  shot.camera_movement
                )}"
              >

            </div>

            <div>

              <label class="field-label">
                Lighting
              </label>

              <input
                data-index="${index}"
                data-field="lighting"
                value="${escapeHtml(
                  shot.lighting
                )}"
              >

            </div>

            <div>

              <label class="field-label">
                Action
              </label>

              <textarea
                data-index="${index}"
                data-field="action"
              >${escapeHtml(
                shot.action
              )}</textarea>

            </div>

            <div>

              <label class="field-label">
                Visual prompt
              </label>

              <textarea
                data-index="${index}"
                data-field="visual_prompt"
              >${escapeHtml(
                shot.visual_prompt
              )}</textarea>

            </div>

            <div>

              <label class="field-label">
                Detailed shot direction
              </label>

              <textarea
                data-index="${index}"
                data-field="detailed_description"
              >${escapeHtml(
                shot.detailed_description
              )}</textarea>

            </div>

            <div>

              <label class="field-label">
                Dialogue
              </label>

              <textarea
                data-index="${index}"
                data-field="speech_text"
              >${escapeHtml(
                shot.speech_text
              )}</textarea>

            </div>

            <div>

              <label class="field-label">
                Soundscape
              </label>

              <textarea
                data-index="${index}"
                data-field="overall_soundscape"
              >${escapeHtml(
                shot.overall_soundscape
              )}</textarea>

            </div>

            <div>

              <label class="field-label">
                Continuity
              </label>

              <textarea
                data-index="${index}"
                data-field="continuity_notes"
              >${escapeHtml(
                shot.continuity_notes
              )}</textarea>

            </div>

          </div>

        </div>
      `;

      root.appendChild(
        card
      );

    }
  );

  root
    .querySelectorAll(
      "[data-field]"
    )
    .forEach(
      element => {

        element.addEventListener(
          "input",
          () => {

            const index =
              Number(
                element.dataset.index
              );

            const field =
              element.dataset.field;

            let value =
              element.value;

            if (
              field === "characters"
            ) {

              value =
                value
                  .split(",")
                  .map(
                    item =>
                      item.trim()
                  )
                  .filter(
                    Boolean
                  );

            }

            plan.shots[index][field] =
              value;

          }
        );

      }
    );
}


function collectStory() {

  plan.story =
    document.getElementById(
      "story"
    ).value;
}


async function saveDraft() {

  collectStory();

  plan.approval = {
    status: "draft",
    approved_at: null
  };

  const response =
    await fetch(
      "/api/save",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            plan
          )
      }
    );

  if (
    !response.ok
  ) {

    alert(
      "Unable to save storyboard draft."
    );

    return;
  }

  renderStatus();

  alert(
    "Storyboard draft saved."
  );
}


async function approvePlan() {

  collectStory();

  const confirmed =
    window.confirm(
      "Approve this storyboard and allow H3 generation to continue?"
    );

  if (!confirmed) {
    return;
  }

  plan.approval = {
    status: "approved",
    approved_at:
      new Date().toISOString()
  };

  const response =
    await fetch(
      "/api/approve",
      {
        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify(
            plan
          )
      }
    );

  if (
    !response.ok
  ) {

    alert(
      "Unable to approve storyboard."
    );

    return;
  }

  renderStatus();

  alert(
    "Storyboard approved."
  );
}


function render() {

  renderStatus();
  renderMeta();
  renderCharacters();
  renderScenes();
  renderTimeline();
  renderShots();
}


reloadPlan().catch(
  error => {

    const status =
      document.getElementById(
        "status"
      );

    status.textContent =
      error.message;

  }
);

</script>

</body>
</html>
