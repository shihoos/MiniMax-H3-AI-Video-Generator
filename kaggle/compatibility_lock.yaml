runtime:
  comfyui: true
  gguf_loader: ComfyUI-GGUF
  h3_nodes: ComfyUI-H3-Multishot
  video_nodes: VideoHelperSuite
  workflow_converter: required

project_workflow_policy:
  manual_ref2va_api: forbidden
  canonical_production_files: true
  turbo_profile_separate: true

base_workflows:
  H3_Extend_Take.json: fl2va
  H3_HardMode_Chained.json: ref2va_plus_fl2va
  H3_HardMode_R2V.json: ref2va
  H3_Keyframes.json: fl2va
  H3_Seamless_Chain_CORE.json: fl2va
  H3_Seamless_Chain_v2.json: fl2va_memory

turbo_workflows:
  H3_Turbo_I2V.json: fl2va_turbo
  H3_Turbo_Ref2V.json: ref2va_turbo
  H3_Turbo_T2V.json: fl2va_turbo

reference_limits:
  max_images: 9
  max_videos: 3
  max_standalone_audio: 3
  max_total_files: 12
