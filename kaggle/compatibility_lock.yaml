runtime:
  comfyui: required
  custom_nodes_manifest: configs/custom_nodes.yaml
  model_manifest: configs/model_inventory.yaml

workflow_policy:
  only_ref2va_generation: true
  only_locked_models: true
  no_q4_models: true
  no_fl2va_model: true
  no_manual_memory_api: true

generation_workflows:
  - ref2v
  - ref2v_chain
  - turbo_ref2v

postprocess_workflows:
  - mmh3_ultimate_upscale

reference_limits:
  max_images: 9
  max_videos: 3
  max_standalone_audio: 3
  max_total_files: 12

resolution:
  generation_width: 960
  generation_height: 544
  final_width: 1280
  final_height: 720

continuity:
  last_frame_reference: true
  sequential_dependency: true
  parallelize_dependent_shots: false

policy:
  pin_custom_node_revisions: true
  vendor_third_party_source: false
  locked_model_inventory: true
