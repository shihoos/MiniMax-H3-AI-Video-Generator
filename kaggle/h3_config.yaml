backend:
  runtime: comfyui
  profile: q4
  workflow_source: repository

dataset:
  name: "MiniMax H3 Ref2VA Q4"

models:
  base:
    ref2va:
      file: "minimax_h3_ref2va_pruned-Q4_K_M.gguf"
      directory: "diffusion_models"

    fl2va:
      file: "minimax_h3_fl2va_pruned-Q4_K_M.gguf"
      directory: "diffusion_models"

    text_encoder:
      file: "qwen3vl_32b_minimax_h3-Q4_K_M.gguf"
      directory: "text_encoders"

    video_vae:
      file: "minimax_h3_video_vae_fp16.safetensors"
      directory: "vae"

    audio_vae:
      file: "minimax_h3_audio_vae_fp32.safetensors"
      directory: "vae"

  turbo:
    enabled: false

    ref2va:
      file: "minimax_h3_ref2va_pruned_int8_convrot.safetensors"
      directory: "diffusion_models"

    fl2va:
      file: "minimax_h3_fl2va_pruned_int8_convrot.safetensors"
      directory: "diffusion_models"

    text_encoder:
      file: "qwen3vl_32b_minimax_h3_int8_convrot.safetensors"
      directory: "text_encoders"

    ref2v_lora:
      file: "minimax_h3_ref2v_turbo_4step_v0.1_comfyui_bf16.safetensors"
      directory: "loras"

    fl2v_lora:
      file: "minimax_h3_fl2v_turbo_8step_v1.0_768p_comfyui_bf16.safetensors"
      directory: "loras"

workflows:
  base:
    - "H3_Extend_Take.json"
    - "H3_HardMode_Chained.json"
    - "H3_HardMode_R2V.json"
    - "H3_Keyframes.json"
    - "H3_Seamless_Chain_CORE.json"
    - "H3_Seamless_Chain_v2.json"

  turbo:
    - "H3_Turbo_I2V.json"
    - "H3_Turbo_Ref2V.json"
    - "H3_Turbo_T2V.json"

  excluded:
    - "H3_Ref2VA_Memory_API.json"

generation:
  width: 1344
  height: 768
  fallback_width: 960
  fallback_height: 544
  fps: 24
  frames_per_shot: 243
  steps: 14
  reference_image_size: "match"

references:
  images: 9
  videos: 3
  standalone_audio: 3
  total_files: 12

identity:
  reference_controls:
    - face
    - facial_geometry
    - hair
    - hairline
    - body_structure
    - body_proportions
    - skin_tone
    - stable_identity_marks

  qwen_controls:
    - clothing
    - accessories
    - makeup
    - temporary_scars
    - injuries
    - physical_state
    - environment
    - lighting
    - props

continuity:
  short_scene_workflow: "H3_HardMode_Chained.json"
  long_scene_workflow: "H3_Seamless_Chain_v2.json"
  fallback_workflow: "H3_Seamless_Chain_CORE.json"

gpu:
  workers:
    - 0
    - 1

  ports:
    - 8188
    - 8189

delivery:
  width: 1280
  height: 720
